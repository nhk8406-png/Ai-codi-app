<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>리듬마스터</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
body{background:#08080f;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;}

/* ── SCREENS ── */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;}
.screen.active{display:flex;}

/* ── TITLE ── */
#screen-title{background:radial-gradient(ellipse at 50% 0%,#1a0a3e 0%,#08080f 70%);overflow:hidden;}
.logo{font-size:clamp(2rem,8vw,3.5rem);font-weight:900;letter-spacing:6px;
  background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#d400ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(180,100,255,0.6));
  animation:logoPulse 1.2s ease-in-out infinite alternate;}
@keyframes logoPulse{from{filter:drop-shadow(0 0 12px rgba(180,100,255,.4))}to{filter:drop-shadow(0 0 28px rgba(180,100,255,.9));}}
.logo-sub{color:rgba(255,255,255,0.35);font-size:0.75rem;letter-spacing:4px;margin:6px 0 24px;}
/* Animated beat bars under title */
.beat-bars{display:flex;gap:5px;align-items:flex-end;height:28px;margin-bottom:20px;}
.beat-bar{width:6px;border-radius:3px;animation:beatBar var(--s) ease-in-out infinite alternate;}
@keyframes beatBar{from{height:4px;opacity:.3}to{height:100%;opacity:1;}}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px;max-width:360px;width:100%;}
.lbtn{width:100%;aspect-ratio:1;border:2px solid var(--c);border-radius:14px;background:transparent;
  color:#fff;font-size:1.05rem;font-weight:800;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;transition:transform .15s,background .15s;
  position:relative;overflow:hidden;padding:2px;}
.lbtn:hover{background:color-mix(in srgb,var(--c) 15%,transparent);}
.lbtn:active{transform:scale(.88);}
.lbtn.locked{--c:#333;color:#444;cursor:not-allowed;}
.lbtn .lv-stars{font-size:0.4rem;letter-spacing:2px;opacity:.8;}
.lbtn .lv-diff{font-size:0.36rem;color:rgba(255,255,255,.45);letter-spacing:.5px;margin-top:1px;}
.lbtn .lv-best{font-size:0.34rem;color:rgba(255,255,255,.3);letter-spacing:.3px;}
/* Difficulty badge in top-left corner */
.lbtn::before{content:attr(data-diff);position:absolute;top:3px;left:5px;
  font-size:0.32rem;font-weight:700;color:var(--c);opacity:.7;letter-spacing:.3px;}
.hint{color:rgba(255,255,255,0.25);font-size:0.72rem;margin-top:18px;letter-spacing:1px;}

/* ── GAME ── */
#screen-game{background:#06060e;padding:0;position:relative;}
#progress-wrap{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.08);z-index:20;}
#progress-bar{height:100%;background:linear-gradient(90deg,#4d96ff,#d400ff);width:0%;transition:width .08s linear;}
#hud{position:absolute;top:4px;left:0;right:0;height:72px;display:flex;
  align-items:center;justify-content:space-between;padding:8px 16px;
  background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);z-index:10;pointer-events:none;}
#score-disp{font-size:1.6rem;font-weight:800;color:#ffd93d;min-width:110px;}
#center-hud{text-align:center;}
#lv-disp{font-size:0.65rem;color:rgba(255,255,255,.35);letter-spacing:3px;}
#bpm-disp{font-size:0.58rem;color:rgba(255,255,255,.2);letter-spacing:2px;margin-top:1px;}
#combo-disp{font-size:2.2rem;font-weight:900;color:#ff6b6b;
  text-shadow:0 0 16px rgba(255,107,107,.9);transition:transform .08s;min-height:44px;}
#combo-disp.bump{transform:scale(1.35);}
/* Right HUD: rank + accuracy stacked */
#right-hud{text-align:right;min-width:70px;}
#live-rank{font-size:2rem;font-weight:900;line-height:1;transition:color .3s;}
#acc-disp{font-size:0.82rem;color:rgba(255,255,255,.55);}
#pause-btn{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);border-radius:8px;
  padding:5px 10px;cursor:pointer;font-size:0.75rem;z-index:15;touch-action:manipulation;}

/* HP bar */
#hp-bar-wrap{position:absolute;top:76px;left:50%;transform:translateX(-50%);
  width:min(100%,420px);height:4px;background:rgba(255,255,255,.08);z-index:12;
  pointer-events:none;border-radius:2px;overflow:hidden;}
#hp-bar{height:100%;width:100%;border-radius:2px;
  background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77);
  transition:width .12s linear,background .4s;}
#hp-bar.danger{background:#ff6b6b;animation:hpPulse .35s ease-in-out infinite alternate;}
@keyframes hpPulse{from{opacity:.65}to{opacity:1;}}

/* Score popup */
.sc-pop{position:absolute;font-size:0.95rem;font-weight:900;pointer-events:none;
  left:50%;transform:translateX(-50%);
  animation:scFloat .65s ease-out forwards;}
@keyframes scFloat{
  0%  {transform:translateX(-50%) translateY(0) scale(1.3);opacity:1;}
  100%{transform:translateX(-50%) translateY(-58px) scale(.8);opacity:0;}
}
.sc-perfect{color:#ffd93d;text-shadow:0 0 10px rgba(255,217,61,.7);}
.sc-good{color:#6bcb77;text-shadow:0 0 8px rgba(107,203,119,.6);}

/* Timing hint inside judgment */
.judg-timing{font-size:0.55rem;opacity:.7;letter-spacing:1.5px;display:block;margin-top:2px;}

/* Background canvas */
#bg-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}

/* Beat flash overlay */
#beat-flash{position:absolute;inset:0;pointer-events:none;z-index:5;
  box-shadow:inset 0 0 80px transparent;transition:box-shadow .05s;}
#beat-flash.kick{box-shadow:inset 0 0 80px rgba(120,60,255,.35);}
#beat-flash.snare{box-shadow:inset 0 0 60px rgba(255,217,61,.2);}

/* Full combo banner */
#fc-banner{position:absolute;top:80px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#ffd93d,#ff8c42);color:#000;font-size:.75rem;
  font-weight:900;padding:5px 16px;border-radius:20px;letter-spacing:2px;
  z-index:12;pointer-events:none;display:none;
  animation:fcPulse 1.5s ease-in-out infinite;}
@keyframes fcPulse{0%,100%{opacity:.8}50%{opacity:1;transform:translateX(-50%) scale(1.05);}}

/* Milestone combo popup */
#milestone{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:1.4rem;font-weight:900;pointer-events:none;z-index:20;
  display:none;animation:milestoneAnim .9s ease-out forwards;}
@keyframes milestoneAnim{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:0;}
  30%{transform:translate(-50%,-50%) scale(1.2);opacity:1;}
  70%{transform:translate(-50%,-70%) scale(1);opacity:1;}
  100%{transform:translate(-50%,-80%) scale(.8);opacity:0;}
}

/* ── GAME AREA / LANES ── */
#game-area{position:absolute;inset:0;display:flex;max-width:420px;left:50%;transform:translateX(-50%);right:auto;}
.lane{flex:1;position:relative;border-right:1px solid rgba(255,255,255,.04);overflow:hidden;
  cursor:pointer;touch-action:manipulation;}
.lane:last-child{border-right:none;}
.lane-key{position:absolute;bottom:14px;width:100%;text-align:center;font-size:0.72rem;font-weight:700;
  opacity:.25;pointer-events:none;}

/* Hit zone */
.hit-zone{position:absolute;bottom:80px;left:8%;right:8%;height:5px;border-radius:3px;
  opacity:.4;pointer-events:none;transition:opacity .1s;transform-origin:center;}
.lane-0 .hit-zone{background:#ff6b6b;}
.lane-1 .hit-zone{background:#ffd93d;}
.lane-2 .hit-zone{background:#6bcb77;}
.lane-3 .hit-zone{background:#4d96ff;}
.lane.lit .hit-zone{opacity:1;}
@keyframes hzPulse{0%{transform:scaleY(4) scaleX(1.06);}100%{transform:scaleY(1) scaleX(1);}}
.hit-zone.beat-pulse{animation:hzPulse .18s ease-out forwards;}
.lane-glow{position:absolute;bottom:0;left:0;right:0;height:90px;
  pointer-events:none;opacity:0;transition:opacity .06s;}
.lane.lit .lane-glow{opacity:1;}
.lane-0 .lane-glow{background:linear-gradient(to top,rgba(255,107,107,.25),transparent);}
.lane-1 .lane-glow{background:linear-gradient(to top,rgba(255,217,61,.25),transparent);}
.lane-2 .lane-glow{background:linear-gradient(to top,rgba(107,203,119,.25),transparent);}
.lane-3 .lane-glow{background:linear-gradient(to top,rgba(77,150,255,.25),transparent);}

/* Miss shake */
@keyframes shakeGame{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-7px)}30%{transform:translateX(7px)}
  45%{transform:translateX(-5px)}60%{transform:translateX(4px)}
  75%{transform:translateX(-2px)}
}
#screen-game.shake{animation:shakeGame .24s ease-out;}

/* Notes */
.note{position:absolute;left:8%;width:84%;height:46px;border-radius:9px;
  pointer-events:none;will-change:top;}
.note-0{background:#ff6b6b;box-shadow:0 0 14px rgba(255,107,107,.7);}
.note-1{background:#ffd93d;box-shadow:0 0 14px rgba(255,217,61,.7);}
.note-2{background:#6bcb77;box-shadow:0 0 14px rgba(107,203,119,.7);}
.note-3{background:#4d96ff;box-shadow:0 0 14px rgba(77,150,255,.7);}
.note::after{content:'';position:absolute;top:4px;left:10%;right:10%;height:8px;
  border-radius:4px;background:rgba(255,255,255,.35);}

/* Judgment text */
.judg{position:absolute;width:100%;text-align:center;font-size:1rem;font-weight:900;
  pointer-events:none;animation:judgeAnim .55s ease-out forwards;}
@keyframes judgeAnim{
  0%{transform:translateY(0) scale(.5);opacity:1;}
  60%{transform:translateY(-40px) scale(1.1);opacity:1;}
  100%{transform:translateY(-70px) scale(.9);opacity:0;}
}
.judg-perfect{color:#ffd93d;}
.judg-good{color:#6bcb77;}
.judg-miss{color:rgba(255,107,107,.7);}

/* Particles */
.pt{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;
  animation:ptAnim var(--d) ease-out forwards;}
@keyframes ptAnim{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0;}
}

/* Countdown */
#countdown{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:5rem;font-weight:900;color:#ffd93d;text-shadow:0 0 40px rgba(255,217,61,.9);
  z-index:50;pointer-events:none;display:none;animation:countPop .75s ease-out forwards;}
@keyframes countPop{
  0%{transform:translate(-50%,-50%) scale(2.5);opacity:0;}
  25%{opacity:1;}
  75%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(.6);opacity:0;}
}

/* ── RESULT ── */
#screen-result{background:radial-gradient(ellipse at 50% 30%,#1a0832 0%,#08080f 70%);padding:20px;text-align:center;}
.res-title{font-size:2.2rem;font-weight:900;margin-bottom:4px;}
.res-lv{color:rgba(255,255,255,.4);font-size:.8rem;letter-spacing:3px;margin-bottom:16px;}
.res-stars{font-size:2.8rem;margin-bottom:8px;letter-spacing:4px;min-height:3.5rem;display:flex;align-items:center;justify-content:center;gap:6px;}
.res-star{display:inline-block;opacity:0;transition:none;}
.res-star.empty{opacity:.22;}
@keyframes starPop{
  0%{transform:scale(0) rotate(-25deg);opacity:0;}
  55%{transform:scale(1.55) rotate(8deg);opacity:1;}
  100%{transform:scale(1) rotate(0);opacity:1;}
}
.res-star.pop{animation:starPop .38s cubic-bezier(.15,1.4,.4,1) forwards;}
.res-score{font-size:3rem;font-weight:900;color:#ffd93d;}
#new-record{font-size:.72rem;font-weight:900;letter-spacing:3px;color:#ffd93d;
  margin:-2px 0 8px;opacity:0;pointer-events:none;min-height:1.2em;}
#new-record.show{animation:newRecPop .45s .08s cubic-bezier(.2,1.5,.4,1) both;}
@keyframes newRecPop{from{transform:scale(0) translateY(10px);opacity:0;}to{transform:none;opacity:1;}}
.res-grade{font-size:5rem;font-weight:900;margin:4px 0 16px;}
#res-grade.animate{animation:gradeReveal .5s cubic-bezier(.17,1.5,.6,1) both;}
@keyframes gradeReveal{
  0%{transform:scale(5) rotate(-10deg);opacity:0;}
  100%{transform:scale(1) rotate(0);opacity:1;}
}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto 24px;}
.stat{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 8px;}
.stat-l{font-size:.62rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;}
.stat-v{font-size:1.4rem;font-weight:700;margin-top:2px;}
.res-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.btn{padding:13px 24px;border:none;border-radius:24px;font-size:.95rem;font-weight:700;
  cursor:pointer;transition:transform .15s;}
.btn:active{transform:scale(.93);}
.btn-sec{background:rgba(255,255,255,.1);color:#fff;}
.btn-pri{background:linear-gradient(135deg,#4d96ff,#6bcb77);color:#fff;}
/* Confetti */
.confetti-p{position:fixed;top:-12px;pointer-events:none;z-index:300;
  animation:confettiFall var(--dur) var(--del) ease-in forwards;}
@keyframes confettiFall{
  0%{transform:translateX(0) rotate(0);opacity:1;}
  100%{transform:translateX(var(--dx)) translateY(108vh) rotate(var(--rot));opacity:0;}
}

/* ── PAUSE OVERLAY ── */
#pause-overlay{position:absolute;inset:0;background:rgba(4,4,14,.88);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;z-index:40;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
#pause-overlay.active{display:flex;animation:pauseFadeIn .18s ease-out;}
@keyframes pauseFadeIn{from{opacity:0;}to{opacity:1;}}
.po-title{font-size:2.2rem;font-weight:900;letter-spacing:6px;color:#fff;}
.po-lv{font-size:.68rem;color:rgba(255,255,255,.28);letter-spacing:3px;margin:-6px 0 10px;}
.po-btns{display:flex;flex-direction:column;gap:10px;width:196px;}
.po-btn{padding:15px 20px;border:none;border-radius:22px;font-size:.95rem;
  font-weight:700;cursor:pointer;transition:transform .14s;touch-action:manipulation;}
.po-btn:active{transform:scale(.91);}
.po-resume{background:linear-gradient(135deg,#4d96ff,#6bcb77);color:#fff;}
.po-retry{background:rgba(255,255,255,.1);color:#fff;}
.po-quit{background:rgba(255,80,80,.1);color:#ff6b6b;border:1px solid rgba(255,107,107,.25);}

/* ── TIMING ACCURACY BAR ── */
#timing-bar{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);
  width:min(70%,280px);height:4px;z-index:8;pointer-events:none;border-radius:2px;}
#timing-bar-bg{position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(90deg,
    rgba(255,140,50,.14) 0%,rgba(255,140,50,.14) 34%,
    rgba(107,203,119,.22) 34%,rgba(107,203,119,.22) 66%,
    rgba(255,217,61,.14) 66%,rgba(255,217,61,.14) 100%);}
#timing-bar-center{position:absolute;left:50%;top:-3px;width:1px;height:10px;
  border-radius:1px;background:rgba(255,255,255,.22);transform:translateX(-50%);}
.t-tick{position:absolute;top:-3px;width:3px;height:10px;border-radius:1.5px;
  transform:translateX(-50%);pointer-events:none;
  animation:tTickFade 2.2s ease-out forwards;}
@keyframes tTickFade{0%{opacity:.9;}60%{opacity:.55;}100%{opacity:0;height:5px;}}
.t-tick.tp{background:#6bcb77;}
.t-tick.te{background:#ff8c42;}
.t-tick.tl{background:#ffd93d;}
#timing-labels{position:absolute;bottom:27px;left:50%;transform:translateX(-50%);
  width:min(70%,280px);display:flex;justify-content:space-between;
  z-index:8;pointer-events:none;}
#timing-labels span{font-size:.33rem;color:rgba(255,255,255,.18);letter-spacing:.4px;font-weight:700;}

/* ── FEVER MODE ── */
#fever-border{position:absolute;inset:0;pointer-events:none;z-index:6;display:none;}
#fever-border.active{display:block;animation:feverGlow 1.5s linear infinite;}
@keyframes feverGlow{
  0%,100%{box-shadow:inset 0 0 70px rgba(255,107,107,.55);}
  25%{box-shadow:inset 0 0 70px rgba(255,217,61,.55);}
  50%{box-shadow:inset 0 0 70px rgba(107,203,119,.55);}
  75%{box-shadow:inset 0 0 70px rgba(77,150,255,.55);}
}
.fever-popup{position:absolute;top:36%;left:50%;font-size:2.4rem;font-weight:900;
  z-index:30;pointer-events:none;white-space:nowrap;letter-spacing:2px;
  animation:feverPopAnim 1.7s ease-out forwards;}
@keyframes feverPopAnim{
  0%{transform:translate(-50%,-50%) scale(.1);opacity:0;}
  18%{transform:translate(-50%,-50%) scale(1.3);opacity:1;}
  55%{transform:translate(-50%,-58%) scale(1);opacity:1;}
  100%{transform:translate(-50%,-70%) scale(.8);opacity:0;}
}

/* ── LEVEL UNLOCK BANNER (result screen) ── */
#unlock-banner{font-size:.8rem;font-weight:900;letter-spacing:2.5px;
  margin-bottom:4px;opacity:0;min-height:1.3em;text-align:center;}
#unlock-banner.show{animation:unlockSlide .5s ease-out both;}
@keyframes unlockSlide{
  from{transform:translateY(-8px) scale(.9);opacity:0;}
  to{transform:none;opacity:1;}
}

/* ── SETTINGS ROW (title screen) ── */
#settings-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;justify-content:center;}
.setting-group{display:flex;align-items:center;gap:6px;}
.setting-label{font-size:0.65rem;color:rgba(255,255,255,.35);letter-spacing:1.5px;white-space:nowrap;}
.speed-btns{display:flex;gap:4px;}
.spd-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.45);border-radius:8px;padding:4px 9px;font-size:0.7rem;
  font-weight:700;cursor:pointer;transition:all .15s;touch-action:manipulation;}
.spd-btn:hover{background:rgba(255,255,255,.13);}
.spd-btn.spd-active{background:rgba(77,150,255,.22);border-color:#4d96ff;color:#4d96ff;}
#vol-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.6);border-radius:8px;padding:4px 11px;font-size:1rem;
  cursor:pointer;transition:all .15s;touch-action:manipulation;}
#vol-btn.muted{opacity:.35;}

/* ── GAME OVER OVERLAY ── */
#game-over-overlay{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;z-index:100;pointer-events:none;}
#game-over-overlay.active{display:flex;}
#game-over-overlay::before{content:'';position:absolute;inset:0;
  animation:goFlash .9s ease-out forwards;}
@keyframes goFlash{
  0%{background:rgba(255,30,30,.7);}
  35%{background:rgba(200,0,0,.4);}
  100%{background:rgba(0,0,0,.55);}
}
.go-text{position:relative;font-size:3rem;font-weight:900;color:#ff3333;
  text-shadow:0 0 50px rgba(255,0,0,1),0 0 20px rgba(255,0,0,.8);letter-spacing:4px;
  animation:goTextPop .35s cubic-bezier(.2,1.6,.4,1) forwards;}
@keyframes goTextPop{0%{transform:scale(2.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
.go-sub{position:relative;font-size:0.85rem;color:rgba(255,180,180,.7);letter-spacing:3px;
  animation:goSubFade .5s .15s ease-out both;}
@keyframes goSubFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>

<!-- ══ TITLE ══ -->
<div id="screen-title" class="screen active">
  <div class="logo">리듬마스터</div>
  <div class="logo-sub">RHYTHM MASTER</div>
  <div class="beat-bars" id="beat-bars"></div>
  <div id="settings-row">
    <div class="setting-group">
      <span class="setting-label">노트 속도</span>
      <div class="speed-btns">
        <button class="spd-btn" data-v="0.75" onclick="setSpeed(0.75)">0.75×</button>
        <button class="spd-btn spd-active" data-v="1" onclick="setSpeed(1)">1×</button>
        <button class="spd-btn" data-v="1.5" onclick="setSpeed(1.5)">1.5×</button>
        <button class="spd-btn" data-v="2" onclick="setSpeed(2)">2×</button>
      </div>
    </div>
    <button id="vol-btn" onclick="toggleVol()">🔊</button>
  </div>
  <div class="level-grid" id="level-grid"></div>
  <div class="hint">키보드: D &nbsp;F &nbsp;J &nbsp;K &nbsp;|&nbsp; 마우스 / 터치로도 플레이</div>
</div>

<!-- ══ GAME ══ -->
<div id="screen-game" class="screen">
  <canvas id="bg-canvas"></canvas>
  <div id="beat-flash"></div>
  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <div id="hud">
    <div id="score-disp">0</div>
    <div id="center-hud">
      <div id="lv-disp">LEVEL 1</div>
      <div id="bpm-disp">60 BPM</div>
      <div id="combo-disp"></div>
    </div>
    <div id="right-hud">
      <div id="live-rank" style="color:#ffd93d">S</div>
      <div id="acc-disp">100%</div>
    </div>
  </div>
  <div id="hp-bar-wrap"><div id="hp-bar"></div></div>
  <div id="fc-banner">FULL COMBO</div>
  <div id="milestone"></div>
  <div id="game-area">
    <div class="lane lane-0" data-lane="0">
      <div class="hit-zone"></div><div class="lane-glow"></div>
      <div class="lane-key">D</div>
    </div>
    <div class="lane lane-1" data-lane="1">
      <div class="hit-zone"></div><div class="lane-glow"></div>
      <div class="lane-key">F</div>
    </div>
    <div class="lane lane-2" data-lane="2">
      <div class="hit-zone"></div><div class="lane-glow"></div>
      <div class="lane-key">J</div>
    </div>
    <div class="lane lane-3" data-lane="3">
      <div class="hit-zone"></div><div class="lane-glow"></div>
      <div class="lane-key">K</div>
    </div>
  </div>
  <div id="timing-bar">
    <div id="timing-bar-bg"></div>
    <div id="timing-bar-center"></div>
  </div>
  <div id="timing-labels">
    <span>EARLY</span><span>PERFECT</span><span>LATE</span>
  </div>
  <div id="fever-border"></div>
  <div id="pause-overlay">
    <div class="po-title">PAUSED</div>
    <div class="po-lv" id="po-lv">LEVEL 1</div>
    <div class="po-btns">
      <button class="po-btn po-resume" onclick="togglePause()">▶ 계속하기</button>
      <button class="po-btn po-retry"  onclick="pauseRetry()">↺ 다시하기</button>
      <button class="po-btn po-quit"   onclick="pauseQuit()">✕ 메뉴로</button>
    </div>
  </div>
  <div id="game-over-overlay">
    <div class="go-text">GAME OVER</div>
    <div class="go-sub">HP 소진</div>
  </div>
  <div id="countdown"></div>
  <button id="pause-btn">일시정지</button>
</div>

<!-- ══ RESULT ══ -->
<div id="screen-result" class="screen">
  <div id="unlock-banner"></div>
  <div class="res-title" id="res-title">클리어!</div>
  <div class="res-lv" id="res-lv">LEVEL 1</div>
  <div class="res-stars" id="res-stars"></div>
  <div class="res-score" id="res-score">0</div>
  <div id="new-record"></div>
  <div class="res-grade" id="res-grade">S</div>
  <div class="stats-grid">
    <div class="stat"><div class="stat-l">Perfect</div><div class="stat-v" id="s-perf" style="color:#ffd93d">0</div></div>
    <div class="stat"><div class="stat-l">Good</div><div class="stat-v" id="s-good" style="color:#6bcb77">0</div></div>
    <div class="stat"><div class="stat-l">Miss</div><div class="stat-v" id="s-miss" style="color:#ff6b6b">0</div></div>
    <div class="stat"><div class="stat-l">최대 콤보</div><div class="stat-v" id="s-combo" style="color:#ff6b6b">0</div></div>
    <div class="stat"><div class="stat-l">정확도</div><div class="stat-v" id="s-acc" style="color:#4d96ff">0%</div></div>
    <div class="stat"><div class="stat-l">랭크</div><div class="stat-v" id="s-rank">-</div></div>
  </div>
  <div class="res-btns">
    <button class="btn btn-sec" onclick="goTitle()">메뉴</button>
    <button class="btn btn-sec" onclick="retry()">다시하기</button>
    <button class="btn btn-pri" id="next-btn" onclick="goNext()">다음 레벨</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
