<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자동 아이콘 생성기</title>
<style>
    *{ box-sizing: border-box; }

    body{
        margin:0;
        background:#111;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        flex-direction:column;
        color:white;
        font-family:Arial, sans-serif;
        gap:24px;
        padding:24px;
    }

    h1{
        margin:0;
        font-size:1.6rem;
        letter-spacing:2px;
    }

    canvas{
        border-radius:24px;
        box-shadow:0 0 40px rgba(255,255,255,0.15);
        width:300px;
        height:300px;
    }

    .controls{
        display:flex;
        flex-direction:column;
        gap:14px;
        width:300px;
    }

    .row{
        display:flex;
        gap:8px;
    }

    .btn{
        flex:1;
        padding:10px 0;
        border:none;
        border-radius:10px;
        cursor:pointer;
        font-size:0.85rem;
        font-weight:bold;
        transition: opacity 0.15s;
    }
    .btn:hover{ opacity:0.8; }

    .btn-pause{ background:#f0a500; color:#111; }
    .btn-download{ background:#2ecc71; color:#111; }
    .btn-once{ background:#3498db; color:#fff; }

    .option-group{
        display:flex;
        gap:6px;
        flex-wrap:wrap;
    }

    .opt{
        flex:1;
        min-width:60px;
        padding:7px 4px;
        border:2px solid #444;
        border-radius:8px;
        background:transparent;
        color:#aaa;
        font-size:0.78rem;
        cursor:pointer;
        text-align:center;
        transition: all 0.15s;
    }
    .opt.active{
        border-color:#fff;
        color:#fff;
        background:#222;
    }

    label{
        font-size:0.8rem;
        color:#aaa;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    input[type=range]{
        width:100%;
        accent-color:#3498db;
    }

    .section-title{
        font-size:0.72rem;
        color:#666;
        text-transform:uppercase;
        letter-spacing:1px;
        margin-bottom:2px;
    }
</style>
</head>
<body>

<h1>자동 아이콘 생성기</h1>

<canvas id="canvas" width="512" height="512"></canvas>

<div class="controls">
    <div class="row">
        <button class="btn btn-pause" id="btnPause">⏸ 일시정지</button>
        <button class="btn btn-once" id="btnOnce">↻ 한 번 생성</button>
        <button class="btn btn-download" id="btnDownload">↓ 저장</button>
    </div>

    <div>
        <div class="section-title">도형</div>
        <div class="option-group" id="shapeGroup">
            <button class="opt active" data-shape="circle">원형</button>
            <button class="opt" data-shape="square">사각형</button>
            <button class="opt" data-shape="rounded">둥근 사각형</button>
            <button class="opt" data-shape="hexagon">육각형</button>
        </div>
    </div>

    <div>
        <div class="section-title">동물</div>
        <div class="option-group" id="animalGroup">
            <button class="opt" data-shape="cat">고양이</button>
            <button class="opt" data-shape="bear">곰</button>
            <button class="opt" data-shape="rabbit">토끼</button>
            <button class="opt" data-shape="dog">강아지</button>
            <button class="opt" data-shape="chick">병아리</button>
        </div>
    </div>

    <div>
        <div class="section-title">스타일</div>
        <div class="option-group" id="styleGroup">
            <button class="opt active" data-style="solid">단색</button>
            <button class="opt" data-style="gradient">그라디언트</button>
            <button class="opt" data-style="twotone">투톤</button>
        </div>
    </div>

    <div>
        <label>
            <span>속도</span>
            <span id="speedLabel">1.0초</span>
        </label>
        <input type="range" id="speedRange" min="200" max="3000" step="100" value="1000">
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const SHAPES = {
    circle:  { textY: 280, fontSize: 220 },
    square:  { textY: 280, fontSize: 220 },
    rounded: { textY: 280, fontSize: 220 },
    hexagon: { textY: 280, fontSize: 220 },
    cat:     { textY: 308, fontSize: 200 },
    bear:    { textY: 312, fontSize: 200 },
    rabbit:  { textY: 348, fontSize: 185 },
    dog:     { textY: 248, fontSize: 200 },
    chick:   { textY: 338, fontSize: 185 },
};

let shape = "circle";
let style = "solid";
let intervalMs = 1000;
let paused = false;
let timer = null;

function randomColor() {
    return "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0");
}

function randomLetter() {
    return letters[Math.floor(Math.random() * letters.length)];
}

function roundedRectPath(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function hexPath(cx, cy, r) {
    for (let i = 0; i < 6; i++) {
        const a = Math.PI / 180 * (60 * i - 30);
        const x = cx + r * Math.cos(a);
        const y = cy + r * Math.sin(a);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
}

function drawShape() {
    ctx.beginPath();

    if (shape === "circle") {
        ctx.arc(256, 256, 220, 0, Math.PI * 2);

    } else if (shape === "square") {
        ctx.rect(36, 36, 440, 440);

    } else if (shape === "rounded") {
        roundedRectPath(36, 36, 440, 440, 80);

    } else if (shape === "hexagon") {
        hexPath(256, 256, 230);

    } else if (shape === "cat") {
        ctx.moveTo(95, 205);
        ctx.lineTo(155, 50);
        ctx.lineTo(225, 182);
        ctx.closePath();
        ctx.moveTo(287, 182);
        ctx.lineTo(357, 50);
        ctx.lineTo(417, 205);
        ctx.closePath();
        ctx.moveTo(441, 295);
        ctx.arc(256, 295, 185, 0, Math.PI * 2);

    } else if (shape === "bear") {
        ctx.moveTo(185, 115);
        ctx.arc(120, 115, 65, 0, Math.PI * 2);
        ctx.moveTo(457, 115);
        ctx.arc(392, 115, 65, 0, Math.PI * 2);
        ctx.moveTo(446, 300);
        ctx.arc(256, 300, 190, 0, Math.PI * 2);

    } else if (shape === "rabbit") {
        roundedRectPath(167, 22, 58, 185, 29);
        roundedRectPath(287, 22, 58, 185, 29);
        ctx.moveTo(416, 340);
        ctx.arc(256, 340, 160, 0, Math.PI * 2);

    } else if (shape === "dog") {
        ctx.moveTo(144, 295);
        ctx.ellipse(82, 295, 62, 118, 0, 0, Math.PI * 2);
        ctx.moveTo(492, 295);
        ctx.ellipse(430, 295, 62, 118, 0, 0, Math.PI * 2);
        ctx.moveTo(441, 240);
        ctx.arc(256, 240, 185, 0, Math.PI * 2);

    } else if (shape === "chick") {
        ctx.moveTo(426, 335);
        ctx.arc(256, 335, 170, 0, Math.PI * 2);
        ctx.moveTo(361, 140);
        ctx.arc(256, 140, 105, 0, Math.PI * 2);
    }
}

function generateIcon() {
    const c1 = randomColor();
    const c2 = randomColor();
    const textColor = randomColor();
    const text = randomLetter();
    const cfg = SHAPES[shape];

    ctx.clearRect(0, 0, 512, 512);

    if (style === "solid") {
        ctx.fillStyle = c1;
        drawShape();
        ctx.fill();

    } else if (style === "gradient") {
        const grad = ctx.createLinearGradient(36, 36, 476, 476);
        grad.addColorStop(0, c1);
        grad.addColorStop(1, c2);
        ctx.fillStyle = grad;
        drawShape();
        ctx.fill();

    } else if (style === "twotone") {
        ctx.fillStyle = c1;
        drawShape();
        ctx.fill();
        ctx.save();
        ctx.beginPath();
        ctx.rect(256, 0, 512, 512);
        ctx.clip();
        ctx.fillStyle = c2;
        drawShape();
        ctx.fill();
        ctx.restore();
    }

    ctx.fillStyle = textColor;
    ctx.font = `bold ${cfg.fontSize}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, 256, cfg.textY);
}

function restartTimer() {
    clearInterval(timer);
    if (!paused) timer = setInterval(generateIcon, intervalMs);
}

function handleShapeClick(e) {
    const t = e.target.closest(".opt[data-shape]");
    if (!t) return;
    document.querySelectorAll(".opt[data-shape]").forEach(b => b.classList.remove("active"));
    t.classList.add("active");
    shape = t.dataset.shape;
    generateIcon();
}

document.getElementById("shapeGroup").addEventListener("click", handleShapeClick);
document.getElementById("animalGroup").addEventListener("click", handleShapeClick);

document.getElementById("styleGroup").addEventListener("click", e => {
    const t = e.target.closest(".opt[data-style]");
    if (!t) return;
    document.querySelectorAll(".opt[data-style]").forEach(b => b.classList.remove("active"));
    t.classList.add("active");
    style = t.dataset.style;
    generateIcon();
});

document.getElementById("btnPause").addEventListener("click", () => {
    paused = !paused;
    document.getElementById("btnPause").textContent = paused ? "▶ 재생" : "⏸ 일시정지";
    restartTimer();
});

document.getElementById("btnOnce").addEventListener("click", () => {
    generateIcon();
});

document.getElementById("btnDownload").addEventListener("click", () => {
    const a = document.createElement("a");
    a.download = "icon.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
});

document.getElementById("speedRange").addEventListener("input", e => {
    intervalMs = +e.target.value;
    document.getElementById("speedLabel").textContent = (intervalMs / 1000).toFixed(1) + "초";
    restartTimer();
});

generateIcon();
timer = setInterval(generateIcon, intervalMs);
</script>

</body>
</html>
