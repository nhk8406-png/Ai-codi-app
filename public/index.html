<script type="module">
// ═══════════════════════════════════════════════════════
//  STRINGS
// ═══════════════════════════════════════════════════════
const STR = {
  title:        "직장상사 혼내기!",
  titleSub:     "with ChatGPT",
  subtitle:     "AI 동료와 함께 상사를 혼내주세요!",
  tapToStart:   "클릭 또는 탭하여 시작!",
  score:        "점수",
  angerLabel:   "😤 분노 게이지",
  hitsLabel:    "총",
  hitsUnit:     "회",
  stageNormal:  "😏 평온한 상사",
  stageAngry:   "😡 분노한 상사",
  stageBeg:     "😭 굴복한 상사",
  miss:         "빗나감!",
  hitWords:     ["꽝!","퍽!","빠직!","쾅!","딱!","파박!","뻥!","철썩!","박!","쿵!"],
  angerFull:    "MAX 분노!!",
  stageAngryAlert: "분노 폭발!!",
  stageBegAlert:   "굴복!!",
  bossCries:    ["살려줘요!","잘못했어요!","으앙!","흑흑...","제발요!","용서해줘요!"],
  bossRages:    ["감히!","야!","회사 관둬!","뭐야 이게!","넌 해고야!","두고 봐!"],
  comboSuffix:  "콤보!",
  headZone:     "헤드샷! ×3",
  bodyZone:     "정타! ×2",
  // ChatGPT lines
  gptIdle:      ["도움이 필요하신가요?","처리 중...","분석 완료!","준비됨 ✓"],
  gptAttack:    ["부당한 업무 지시 감지!","AI가 나섰습니다!","논리적 반박!","데이터 기반 공격!","처리율 100%!","오류 감지: 꼰대"],
  gptCharge:    "AI 빔 충전 중!",
  gptFire:      "AI 빔 발사!! ⚡",
  gptReady:     "AI 스킬 준비됨! 클릭!",
  gptCooldown:  "충전 중...",
};

// ═══════════════════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");
const DPR_CAP = 1.5;
let W=0,H=0,dpr=1;
function resize(){
  dpr=Math.min(devicePixelRatio||1,DPR_CAP);
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
addEventListener("orientationchange",resize);
resize();

// ═══════════════════════════════════════════════════════
//  RNG
// ═══════════════════════════════════════════════════════
let seed=Date.now()&0xffffff;
function rand(){seed=(seed*1664525+1013904223)&0xffffffff;return(seed>>>0)/0xffffffff;}
function ri(a,b){return Math.floor(rand()*(b-a+1))+a;}
function rr(a,b){return a+rand()*(b-a);}
function rpick(arr){return arr[Math.floor(rand()*arr.length)];}

// ═══════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════
let phase="start";
let score=0, combo=0, comboTick=0;
let anger=0, totalHits=0, bossStage=0;
let globalT=0;

// boss visuals
let hitFlash=0;
let bossBounce=0, bossBounceV=0;
let bossShakeX=0, bossShakeY=0, bossShakeTick=0;
let screenShakeX=0, screenShakeY=0, screenShakeTick=0;
let lastHitMs=0;
let zoneFlash={label:"",alpha:0,x:0,y:0};

// particles / floats
let particles=[];
let floatTexts=[];
let bgSparkles=[];

// ── ChatGPT state ──
let gpt = {
  // position (set in draw based on W,H)
  charge: 0,         // 0..1 charge meter
  cooldown: 0,       // frames until next auto-attack
  skillReady: false, // player-activatable
  skillCooldown: 0,  // frames after skill use
  bobT: 0,           // bob animation
  eyeT: 0,           // eye animation
  speech: "",        // current speech bubble
  speechTimer: 0,
  beamActive: 0,     // frames the beam is visible
  beamIsBig: false,  // normal vs skill beam
  autoAttackTimer: 180, // frames between auto attacks
  shakeX:0, shakeY:0, shakeTick:0,
};

function resetGame(){
  score=0;combo=0;comboTick=0;anger=0;totalHits=0;bossStage=0;globalT=0;
  hitFlash=0;bossBounce=0;bossBounceV=0;
  bossShakeX=0;bossShakeY=0;bossShakeTick=0;
  screenShakeX=0;screenShakeY=0;screenShakeTick=0;
  particles=[];floatTexts=[];bgSparkles=[];lastHitMs=0;
  zoneFlash={label:"",alpha:0,x:0,y:0};
  gpt.charge=0;gpt.cooldown=0;gpt.skillReady=false;gpt.skillCooldown=0;
  gpt.bobT=0;gpt.eyeT=0;gpt.speech="";gpt.speechTimer=0;
  gpt.beamActive=0;gpt.beamIsBig=false;gpt.autoAttackTimer=180;
  gpt.shakeX=0;gpt.shakeY=0;gpt.shakeTick=0;
  phase="play";
}

// ═══════════════════════════════════════════════════════
//  GEOMETRY HELPERS
// ═══════════════════════════════════════════════════════
function bossCX(){return W/2;}
function bossCY(){return H*0.54+bossBounce;}
function bossW(){return Math.min(W*0.3,175);}
function bossH(){return bossW()*1.65;}

function gptCX(){return Math.min(W*0.12,90);}
function gptCY(){return H*0.60+Math.sin(gpt.bobT)*6;}
function gptSize(){return Math.min(W*0.1,70);}

function getGptRect(){
  const s=gptSize()*1.4;
  return {x:gptCX()-s/2, y:gptCY()-s/2, w:s, h:s*1.2};
}

function getZone(px,py){
  const cx=bossCX()+bossShakeX, cy=bossCY()+bossShakeY;
  const bw=bossW(),bh=bossH();
  const dx=px-cx, dy=py-(cy-bh*.25);
  if(Math.abs(dx)>bw*.65||Math.abs(dy)>bh*.65) return null;
  const rel=(dy+bh*.5)/bh;
  if(rel<0.28) return "head";
  if(rel<0.62) return "body";
  return "legs";
}

function inGptZone(px,py){
  const r=getGptRect();
  return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;
}

// ═══════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════
canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(phase==="start"){resetGame();return;}
  handleClick(e.clientX,e.clientY);
},{passive:false});
addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="Enter"){
    e.preventDefault();
    if(phase==="start"){resetGame();return;}
    handleClick(W/2,H*0.52);
  }
});

// ═══════════════════════════════════════════════════════
//  CLICK HANDLER
// ═══════════════════════════════════════════════════════
function handleClick(px,py){
  // ChatGPT skill activation
  if(inGptZone(px,py)){
    if(gpt.skillReady&&gpt.skillCooldown===0){
      fireGptSkill();
    } else if(!gpt.skillReady){
      gptSpeak(STR.gptCooldown);
    }
    return;
  }

  // boss hit
  const zone=getZone(px,py);
  if(!zone){
    combo=0;comboTick=0;
    spawnFloat(px,py,STR.miss,"#aaa",0.85);
    return;
  }
  const now=performance.now();
  combo=(now-lastHitMs<900)?combo+1:1;
  comboTick=130; lastHitMs=now;

  const mult=zone==="head"?3:zone==="body"?2:1;
  const cBonus=Math.min(combo,20);
  const pts=mult*cBonus;
  score+=pts; totalHits++;
  anger=Math.min(1,anger+0.013*mult);
  // charge gpt
  gpt.charge=Math.min(1,gpt.charge+0.04*mult);
  if(gpt.charge>=1&&!gpt.skillReady){
    gpt.skillReady=true;
    gptSpeak(STR.gptReady);
    spawnFloat(gptCX()+gptSize()*1.5,gptCY()-gptSize(),STR.gptReady,"#10a37f",1.3);
  }

  // stage transitions
  if(totalHits>=1500&&bossStage<2){bossStage=2;spawnFloat(W/2,H*.28,STR.stageBegAlert,"#ff69b4",2.2);bigShake(14,18);}
  else if(totalHits>=500&&bossStage<1){bossStage=1;spawnFloat(W/2,H*.28,STR.stageAngryAlert,"#ff3300",2.2);bigShake(10,14);}

  bossShakeX=rr(-10,10);bossShakeY=rr(-8,8);bossShakeTick=10;
  screenShakeX=rr(-4,4);screenShakeY=rr(-4,4);screenShakeTick=6;
  hitFlash=7; bossBounceV=-5-mult;

  const count=Math.min(5+Math.floor(combo*.5),18);
  for(let i=0;i<count;i++) spawnParticle(px,py);
  spawnFloat(px,py-24,rpick(STR.hitWords),"#ffcc00",1.5);
  if(pts>2) spawnFloat(px+28,py,"+"+pts,"#fff",1);
  if(zone==="head") zoneFlash={label:STR.headZone,alpha:1,x:px,y:py-60};
  else if(zone==="body") zoneFlash={label:STR.bodyZone,alpha:1,x:px,y:py-40};

  if(combo%8===0&&combo>0){
    const q=bossStage===2?rpick(STR.bossCries):rpick(STR.bossRages);
    spawnFloat(W/2,H*.28,q,bossStage===2?"#ff88cc":"#ff2200",1.6);
  }
  if(anger>=1){
    anger=0; bigShake(12,20);
    spawnFloat(W/2,H*.24,STR.angerFull,"#ff0000",2.4);
    for(let i=0;i<24;i++) spawnParticle(bossCX(),bossCY()-bossH()*.1,true);
  }
}

function bigShake(sx,bsx){
  screenShakeX=sx;screenShakeY=sx;screenShakeTick=20;
  bossShakeX=bsx;bossShakeY=bsx;bossShakeTick=16;
}

// ═══════════════════════════════════════════════════════
//  GPT ACTIONS
// ═══════════════════════════════════════════════════════
function gptAutoAttack(){
  const pts=ri(5,15)*(1+bossStage);
  score+=pts; totalHits++;
  anger=Math.min(1,anger+0.008);
  gpt.charge=Math.min(1,gpt.charge+0.06);
  if(gpt.charge>=1&&!gpt.skillReady){
    gpt.skillReady=true;
    gptSpeak(STR.gptReady);
    spawnFloat(gptCX()+gptSize()*1.5,gptCY()-gptSize(),STR.gptReady,"#10a37f",1.3);
  }
  gpt.beamActive=22; gpt.beamIsBig=false;
  gpt.shakeX=rr(-5,5);gpt.shakeY=rr(-5,5);gpt.shakeTick=8;
  spawnFloat(W/2,H*.38,rpick(STR.gptAttack),"#10a37f",1.2);
  spawnFloat(bossCX(),bossCY()-bossH()*.2,"+"+pts,"#10a37f",1);
  bossShakeX=rr(-6,6);bossShakeY=rr(-4,4);bossShakeTick=8;
  hitFlash=5;
  for(let i=0;i<8;i++) spawnParticle(bossCX()+rr(-40,40),bossCY()-bossH()*.3+rr(-20,20),false,"#10a37f");
}

function fireGptSkill(){
  const pts=ri(150,250)*(1+bossStage);
  score+=pts; totalHits+=ri(20,40);
  anger=Math.min(1,anger+0.3);
  gpt.charge=0; gpt.skillReady=false;
  gpt.skillCooldown=240; // 4 second cooldown
  gpt.beamActive=45; gpt.beamIsBig=true;
  gpt.shakeX=12;gpt.shakeY=12;gpt.shakeTick=20;
  bigShake(16,22);
  spawnFloat(W/2,H*.22,STR.gptFire,"#10a37f",2.5);
  spawnFloat(bossCX(),bossCY()-bossH()*.4,"+"+pts,"#ffffff",2);
  for(let i=0;i<35;i++) spawnParticle(bossCX()+rr(-60,60),bossCY()-bossH()*.3+rr(-40,40),true,"#10a37f");
  if(anger>=1){
    anger=0;
    for(let i=0;i<20;i++) spawnParticle(bossCX(),bossCY()-bossH()*.1,true);
  }
}

function gptSpeak(text){
  gpt.speech=text; gpt.speechTimer=120;
}

// ═══════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════
const PCOLS=["#ffcc00","#ff7700","#ff3300","#ffffff","#ffee55","#ff99cc","#00ccff","#aaffaa"];

function spawnParticle(x,y,burst=false,colorOverride=null){
  const ang=rand()*Math.PI*2;
  const spd=burst?rr(4,14):rr(2,8);
  particles.push({
    x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-rr(1,5),
    life:1,decay:rr(0.018,0.055),size:rr(3,burst?18:12),
    color:colorOverride||rpick(PCOLS),shape:rand()>.45?"star":"circle",
    rot:rand()*Math.PI*2,rotV:rr(-0.15,0.15),
  });
}

function spawnFloat(x,y,text,color,scale=1){
  floatTexts.push({x,y,text,color,scale,life:1,vy:-2.2});
}

function spawnBgSparkle(){
  bgSparkles.push({
    x:rand()*W,y:rand()*H,size:rr(2,8),
    color:rpick(["#ffcc00","#ff6600","#ff3399","#00eeff","#10a37f","#ffff44"]),
    life:1,vy:-rr(1,4),vx:rr(-1.5,1.5),rot:rand()*Math.PI*2,rotV:rr(-0.12,0.12),
  });
}

// ═══════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════
const STEP=1000/60;
let acc=0,last=performance.now(),paused=false;
let frameCount=0,fpsAt=last,fps=0;
addEventListener("blur",()=>{paused=true;});
addEventListener("focus",()=>{paused=false;last=performance.now();});

function update(){
  globalT++;
  if(phase!=="play") return;

  if(comboTick>0){comboTick--;if(comboTick===0)combo=0;}
  bossBounceV+=0.85; bossBounce+=bossBounceV;
  if(bossBounce>0){bossBounce=0;bossBounceV*=-0.4;if(Math.abs(bossBounceV)<0.5)bossBounceV=0;}
  if(bossShakeTick>0){bossShakeTick--;bossShakeX*=0.72;bossShakeY*=0.72;}
  if(screenShakeTick>0){screenShakeTick--;screenShakeX*=0.72;screenShakeY*=0.72;}
  if(hitFlash>0) hitFlash--;
  if(zoneFlash.alpha>0){zoneFlash.alpha-=0.03;zoneFlash.y-=0.5;}

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.rot+=p.rotV;p.life-=p.decay;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=floatTexts.length-1;i>=0;i--){
    const t=floatTexts[i];
    t.y+=t.vy;t.vy*=0.94;t.life-=0.016;
    if(t.life<=0) floatTexts.splice(i,1);
  }
  if(bossStage>=1&&globalT%5===0) spawnBgSparkle();
  for(let i=bgSparkles.length-1;i>=0;i--){
    const s=bgSparkles[i];
    s.x+=s.vx;s.y+=s.vy;s.rot+=s.rotV;s.life-=0.018;
    if(s.life<=0||s.y<-20) bgSparkles.splice(i,1);
  }

  // ── GPT update ──
  gpt.bobT+=0.04; gpt.eyeT+=0.03;
  if(gpt.beamActive>0) gpt.beamActive--;
  if(gpt.speechTimer>0) gpt.speechTimer--;
  if(gpt.skillCooldown>0) gpt.skillCooldown--;
  if(gpt.shakeTick>0){gpt.shakeTick--;gpt.shakeX*=0.7;gpt.shakeY*=0.7;}

  // GPT auto attack
  gpt.autoAttackTimer--;
  if(gpt.autoAttackTimer<=0){
    gpt.autoAttackTimer=ri(100,160);
    gptAutoAttack();
  }

  // GPT idle speech
  if(gpt.speechTimer===0&&globalT%240===0){
    gptSpeak(rpick(STR.gptIdle));
  }
}

// ═══════════════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════════════
function rr2(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function drawStar5(cx,cy,r,fill,stroke){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5-Math.PI/2;
    const rad=i%2===0?r:r*.42;
    const px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
}

// ═══════════════════════════════════════════════════════
//  BACKGROUND
// ═══════════════════════════════════════════════════════
function drawBG(){
  const angerTint=anger*.12+(bossStage>=1?.05:0);
  ctx.fillStyle="#e8dcc8";ctx.fillRect(0,0,W,H*.66);
  ctx.fillStyle="#c8b890";ctx.fillRect(0,H*.66,W,H*.34);
  ctx.fillStyle="#8b6e44";ctx.fillRect(0,H*.645,W,H*.022);
  ctx.fillStyle="rgba(200,185,160,0.4)";
  ctx.fillRect(0,H*.1,W,H*.01);ctx.fillRect(0,H*.55,W,H*.01);

  // Window
  const wx=W*.58,wy=H*.04,ww=Math.min(W*.3,190),wh=H*.42;
  ctx.fillStyle="#7a5a30";rr2(wx-10,wy-10,ww+20,wh+20,10);ctx.fill();
  const sky=ctx.createLinearGradient(wx,wy,wx,wy+wh);
  sky.addColorStop(0,"#6aaee8");sky.addColorStop(1,"#c8e8ff");
  ctx.fillStyle=sky;ctx.fillRect(wx,wy,ww,wh);
  ctx.fillStyle=bossStage>=1?"#7a4a4a":"#5a7a9a";
  [[0,.55,.12,.45],[.12,.38,.09,.62],[.2,.48,.1,.52],[.3,.32,.09,.68],
   [.4,.52,.11,.48],[.52,.42,.1,.58],[.63,.28,.09,.72],[.72,.48,.28,.52]].forEach(([bx,bt,bw,bh])=>{
    ctx.fillRect(wx+bx*ww,wy+bt*wh,bw*ww,bh*wh);
  });
  ctx.fillStyle="#7a5a30";
  ctx.fillRect(wx,wy+wh/2-3,ww,6);ctx.fillRect(wx+ww/2-3,wy,6,wh);
  ctx.fillStyle="rgba(255,255,255,0.12)";ctx.fillRect(wx+4,wy+4,ww*.45,wh*.45);

  // Desk (right side only — left is where ChatGPT stands)
  const dy=H*.66;
  ctx.fillStyle="#6b4420";ctx.fillRect(W*.42,dy-H*.035,W*.5,H*.04);
  ctx.fillStyle="#573618";
  ctx.fillRect(W*.44,dy+H*.005,W*.04,H*.13);
  ctx.fillRect(W*.84,dy+H*.005,W*.04,H*.13);
  ctx.fillStyle="#1a1a2a";rr2(W*.55,dy-H*.18,W*.14,H*.145,4);ctx.fill();
  const screen=ctx.createLinearGradient(W*.55,dy-H*.18,W*.55,dy-H*.04);
  screen.addColorStop(0,"#1133aa");screen.addColorStop(1,"#334499");

  ctx.fillStyle="#1a1a2a";ctx.fillRect(W*.615,dy-H*.04,W*.018,H*.04);

  ctx.fillStyle="#dd3333";rr2(W*.75,dy-H*.07,W*.04,H*.04,3);ctx.fill();
  ctx.fillStyle="#fff";ctx.fillRect(W*.76,dy-H*.065,W*.02,H*.015);

  // Bookshelf
  const sx=W*.87,sy=H*.12;
  ctx.fillStyle="#7a5a30";ctx.fillRect(sx,sy,W*.1,H*.018);
  ctx.fillRect(sx,sy+H*.12,W*.1,H*.018);

  ctx.fillRect(sx+W*.094,sy-H*.01,W*.006,H*.15);

  }
}

// ═══════════════════════════════════════════════════════
//  CHATGPT ROBOT
// ═══════════════════════════════════════════════════════
function drawGPT(){
  const cx=gptCX()+gpt.shakeX, cy=gptCY()+gpt.shakeY;
  const s=gptSize();

  // glow aura (green when skill ready)
  if(gpt.skillReady){
    const glowPulse=0.5+Math.sin(globalT*.12)*.5;
    const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,s*2);
    grd.addColorStop(0,`rgba(16,163,127,${0.3*glowPulse})`);
    grd.addColorStop(1,"rgba(16,163,127,0)");
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx,cy,s*2,0,Math.PI*2);ctx.fill();
  }

  // body — rounded square robot
  const bx=cx-s*.55, by=cy-s*.55;
  const bw=s*1.1, bh=s*1.2;

  // body shadow
  ctx.fillStyle="rgba(0,0,0,0.18)";
  ctx.beginPath();ctx.ellipse(cx,cy+bh*.55,s*.55,s*.1,0,0,Math.PI*2);ctx.fill();

  // main body
  const bodyGrad=ctx.createLinearGradient(bx,by,bx+bw,by+bh);
  bodyGrad.addColorStop(0,"#1a2a3a");
  bodyGrad.addColorStop(1,"#0d1a28");
  ctx.fillStyle=bodyGrad;
  rr2(bx,by,bw,bh,s*.22);ctx.fill();
  ctx.strokeStyle="#10a37f";ctx.lineWidth=2;
  rr2(bx,by,bw,bh,s*.22);ctx.stroke();

  // chest screen (mini terminal)
  ctx.fillStyle="#0a1a14";
  rr2(bx+s*.12,by+s*.32,bw-s*.24,bh*.38,s*.1);ctx.fill();
  ctx.strokeStyle="#10a37f";ctx.lineWidth=1.5;
  rr2(bx+s*.12,by+s*.32,bw-s*.24,bh*.38,s*.1);ctx.stroke();

  // screen content — charge bar or GPT logo
  const screenX=bx+s*.16, screenY=by+s*.36, screenW=bw-s*.32, screenH=bh*.3;
  if(gpt.skillReady){
    // pulsing READY text
    const rp=0.7+Math.sin(globalT*.18)*.3;
    ctx.fillStyle=`rgba(16,163,127,${rp})`;
    ctx.font=`bold ${Math.floor(s*.18)}px Arial,sans-serif`;
    ctx.textAlign="center";
    ctx.fillText("READY",cx,screenY+screenH*.65);
  } else {
    // charge bar
    ctx.fillStyle="#0d261e";ctx.fillRect(screenX,screenY+screenH*.1,screenW,screenH*.35);
    const chargeGrad=ctx.createLinearGradient(screenX,0,screenX+screenW,0);
    chargeGrad.addColorStop(0,"#10a37f");chargeGrad.addColorStop(1,"#00ffcc");
    ctx.fillStyle=chargeGrad;
    ctx.fillRect(screenX,screenY+screenH*.1,screenW*gpt.charge,screenH*.35);
    ctx.strokeStyle="#10a37f";ctx.lineWidth=1;
    ctx.strokeRect(screenX,screenY+screenH*.1,screenW,screenH*.35);
    // percent text
    ctx.fillStyle="#10a37f";
    ctx.font=`bold ${Math.floor(s*.14)}px Arial,sans-serif`;
    ctx.textAlign="center";
    ctx.fillText(Math.floor(gpt.charge*100)+"%",cx,screenY+screenH*.85);
  }

  // head — rounded square
  const hx=cx-s*.42, hy=by-s*.72, hw=s*.84, hh=s*.7;
  const headGrad=ctx.createLinearGradient(hx,hy,hx+hw,hy+hh);
  headGrad.addColorStop(0,"#1e3040");headGrad.addColorStop(1,"#0d1e2e");
  ctx.fillStyle=headGrad;
  rr2(hx,hy,hw,hh,s*.18);ctx.fill();
  ctx.strokeStyle="#10a37f";ctx.lineWidth=2;
  rr2(hx,hy,hw,hh,s*.18);ctx.stroke();

  // antenna
  ctx.strokeStyle="#10a37f";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx,hy);ctx.lineTo(cx,hy-s*.25);ctx.stroke();
  // antenna light
  const antPulse=0.6+Math.sin(globalT*.15)*.4;
  ctx.fillStyle=`rgba(16,163,127,${antPulse})`;
  ctx.beginPath();ctx.arc(cx,hy-s*.28,s*.06,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.stroke();

  // eyes — glowing ovals
  const eyeY=hy+hh*.38;
  const eyeGlow=0.7+Math.sin(gpt.eyeT)*.3;
  const eyeBlink=Math.sin(globalT*.8)>0.92?0.1:1; // occasional blink
  [-0.24,0.24].forEach(ex=>{
    // eye socket
    ctx.fillStyle="#0a1a14";
    ctx.beginPath();ctx.ellipse(cx+ex*hw,eyeY,s*.12,s*.1*eyeBlink,0,0,Math.PI*2);ctx.fill();
    // iris
    const eyeIrisFill=ctx.createRadialGradient(cx+ex*hw,eyeY,0,cx+ex*hw,eyeY,s*.1);
    eyeIrisFill.addColorStop(0,`rgba(100,255,200,${eyeGlow})`);
    eyeIrisFill.addColorStop(1,`rgba(16,163,127,${eyeGlow*.7})`);
    ctx.fillStyle=eyeIrisFill;
    ctx.beginPath();ctx.ellipse(cx+ex*hw,eyeY,s*.1,s*.085*eyeBlink,0,0,Math.PI*2);ctx.fill();
    // pupil
    ctx.fillStyle=`rgba(0,0,0,0.8)`;
    ctx.beginPath();ctx.ellipse(cx+ex*hw+Math.sin(gpt.eyeT)*.02*s,eyeY,s*.04,s*.04*eyeBlink,0,0,Math.PI*2);ctx.fill();
    // shine
    ctx.fillStyle="rgba(255,255,255,0.8)";
    ctx.beginPath();ctx.ellipse(cx+ex*hw-s*.02,eyeY-s*.025,s*.02,s*.015*eyeBlink,0,0,Math.PI*2);ctx.fill();
  });

  // mouth — LED bar
  const mouthY=hy+hh*.72;
  ctx.fillStyle="#0a1a14";
  rr2(cx-s*.2,mouthY-s*.04,s*.4,s*.08,s*.03);ctx.fill();
  // animated dots
  for(let i=0;i<5;i++){
    const active=(Math.floor(globalT*.08)+i)%5===0;
    ctx.fillStyle=active?"#10a37f":"#0d3328";
    ctx.beginPath();ctx.arc(cx-s*.16+i*s*.08,mouthY,s*.03,0,Math.PI*2);ctx.fill();
  }

  // arms
  ctx.strokeStyle="#10a37f";ctx.lineWidth=3;ctx.lineCap="round";
  // left arm
  ctx.beginPath();ctx.moveTo(bx,by+bh*.3);ctx.lineTo(bx-s*.3,by+bh*.5);ctx.stroke();
  ctx.fillStyle="#1a2a3a";ctx.beginPath();ctx.arc(bx-s*.3,by+bh*.5,s*.1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#10a37f";ctx.lineWidth=1.5;ctx.stroke();
  // right arm — raised if skill ready
  const armRaise=gpt.skillReady?-0.4:0;
  ctx.strokeStyle="#10a37f";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(bx+bw,by+bh*.3);ctx.lineTo(bx+bw+s*.3,by+bh*(0.5+armRaise));ctx.stroke();
  ctx.fillStyle="#1a2a3a";ctx.beginPath();ctx.arc(bx+bw+s*.3,by+bh*(0.5+armRaise),s*.1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#10a37f";ctx.lineWidth=1.5;ctx.stroke();

  // feet
  [-0.25,0.25].forEach(fx=>{
    ctx.fillStyle="#1a2a3a";
    rr2(cx+fx*s*.8-s*.15,by+bh-s*.05,s*.3,s*.18,s*.06);ctx.fill();
    ctx.strokeStyle="#10a37f";ctx.lineWidth=1.5;ctx.stroke();
  });

  // "ChatGPT" label above
  ctx.fillStyle="#10a37f";
  ctx.font=`bold ${Math.floor(s*.22)}px Arial,sans-serif`;
  ctx.textAlign="center";
  ctx.fillText("ChatGPT",cx,hy-s*.35);
  ctx.font=`${Math.floor(s*.16)}px Arial,sans-serif`;
  ctx.fillStyle="#88ccbb";
  ctx.fillText("AI 동료",cx,hy-s*.16);

  // click hint
  if(gpt.skillReady&&gpt.skillCooldown===0){
    ctx.save();
    const p=0.65+Math.sin(globalT*.15)*.35;
    ctx.globalAlpha=p;
    ctx.fillStyle="#10a37f";
    ctx.font=`bold ${Math.floor(s*.18)}px Arial,sans-serif`;
    ctx.fillText("👆 클릭!",cx,by+bh+s*.28);
    ctx.restore();
  } else if(gpt.skillCooldown>0){
    ctx.fillStyle="#557766";
    ctx.font=`${Math.floor(s*.15)}px Arial,sans-serif`;
    ctx.fillText(`${Math.ceil(gpt.skillCooldown/60)}초`,cx,by+bh+s*.28);
  }

  // speech bubble
  if(gpt.speechTimer>0&&gpt.speech){
    const alpha=Math.min(1,gpt.speechTimer/20);
    ctx.save();ctx.globalAlpha=alpha;
    const tw=ctx.measureText(gpt.speech).width+24;
    const tx=cx+s*.6, ty=hy-s*.1;
    ctx.fillStyle="rgba(10,26,20,0.92)";
    rr2(tx,ty-22,Math.max(tw,70),30,8);ctx.fill();
    ctx.strokeStyle="#10a37f";ctx.lineWidth=1.5;
    rr2(tx,ty-22,Math.max(tw,70),30,8);ctx.stroke();
    // tail
    ctx.beginPath();ctx.moveTo(tx,ty-8);ctx.lineTo(tx-12,ty-2);ctx.lineTo(tx,ty+4);ctx.fill();
    ctx.fillStyle="#10a37f";
    ctx.font=`bold ${Math.floor(s*.18)}px Arial,sans-serif`;
    ctx.textAlign="left";
    ctx.fillText(gpt.speech,tx+10,ty-2);
    ctx.restore();
  }

  ctx.textAlign="center"; // reset
}

// ═══════════════════════════════════════════════════════
//  GPT BEAM
// ═══════════════════════════════════════════════════════
function drawGptBeam(){
  if(gpt.beamActive<=0) return;
  const alpha=gpt.beamActive/45;
  const fromX=gptCX()+gptSize()*.6, fromY=gptCY()-gptSize()*.3;
  const toX=bossCX(), toY=bossCY()-bossH()*.3;

  ctx.save();
  ctx.globalAlpha=alpha;

  if(gpt.beamIsBig){
    // BIG SKILL BEAM — layered
    // outer glow
    ctx.strokeStyle="rgba(100,255,200,0.3)";
    ctx.lineWidth=30;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(fromX,fromY);ctx.lineTo(toX,toY);ctx.stroke();
    // mid beam
    ctx.strokeStyle="#10a37f";ctx.lineWidth=12;
    ctx.beginPath();ctx.moveTo(fromX,fromY);ctx.lineTo(toX,toY);ctx.stroke();
    // core
    ctx.strokeStyle="#ffffff";ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(fromX,fromY);ctx.lineTo(toX,toY);ctx.stroke();
    // impact at boss
    const impR=20+Math.sin(globalT*.3)*8;
    const impGrd=ctx.createRadialGradient(toX,toY,0,toX,toY,impR*2);
    impGrd.addColorStop(0,"rgba(255,255,255,0.9)");
    impGrd.addColorStop(0.4,"rgba(16,163,127,0.7)");
    impGrd.addColorStop(1,"rgba(16,163,127,0)");
    ctx.fillStyle=impGrd;ctx.beginPath();ctx.arc(toX,toY,impR*2,0,Math.PI*2);ctx.fill();
    drawStar5(toX,toY,impR,"rgba(100,255,200,0.8)","rgba(16,163,127,0.5)");
  } else {
    // normal auto-attack beam
    ctx.strokeStyle="rgba(16,163,127,0.4)";ctx.lineWidth=8;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(fromX,fromY);ctx.lineTo(toX,toY);ctx.stroke();
    ctx.strokeStyle="#10a37f";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(fromX,fromY);ctx.lineTo(toX,toY);ctx.stroke();
    ctx.strokeStyle="rgba(200,255,240,0.8)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(fromX,fromY);ctx.lineTo(toX,toY);ctx.stroke();
    // small impact
    const grd=ctx.createRadialGradient(toX,toY,0,toX,toY,16);
    grd.addColorStop(0,"rgba(16,163,127,0.8)");grd.addColorStop(1,"rgba(16,163,127,0)");
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(toX,toY,16,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawBoss(){
  const cx=bossCX()+bossShakeX, cy=bossCY()+bossShakeY;
  const bw=bossW(), bh=bossH();

  if(hitFlash>0){ctx.fillStyle=`rgba(255,255,255,${hitFlash/7*.25})`;ctx.fillRect(0,0,W,H);}
  ctx.fillStyle="rgba(0,0,0,0.13)";
  ctx.beginPath();ctx.ellipse(cx,cy+bh*.48,bw*.52,bh*.06,0,0,Math.PI*2);ctx.fill();

  ctx.save();ctx.translate(cx,cy);
  const wag=bossShakeTick>0?Math.sin(globalT*.4)*.07:Math.sin(globalT*.018)*.012;
  ctx.rotate(wag);

  if(bossStage===0)      drawNormal(bw,bh);
  else if(bossStage===1) drawAngry(bw,bh);

  ctx.restore();
}

  ctx.globalAlpha=0.65;
  for(const side of[-1,1]){

  }
  ctx.globalAlpha=1;
}

function drawBeg(bw,bh){
  const lw=3;
  ctx.fillStyle="#4a5566";
  ctx.beginPath();ctx.ellipse(-bw*.22,bh*.44,bw*.17,bh*.07,0.3,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#333";ctx.lineWidth=lw;ctx.stroke();
  ctx.beginPath();ctx.ellipse(bw*.22,bh*.44,bw*.17,bh*.07,-0.3,0,Math.PI*2);ctx.fill();ctx.stroke();
  rr2(-bw*.3,bh*.24,bw*.22,bh*.22,6);ctx.fill();ctx.stroke();
  rr2(bw*.08,bh*.24,bw*.22,bh*.22,6);ctx.fill();ctx.stroke();
  ctx.fillStyle="#222";
  ctx.beginPath();ctx.ellipse(-bw*.15,bh*.47,bw*.13,bh*.032,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bw*.15,bh*.47,bw*.13,bh*.032,0,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.rotate(0.14);
  ctx.fillStyle="#6677aa";rr2(-bw*.38,-bh*.05,bw*.76,bh*.3,10);ctx.fill();ctx.strokeStyle="#445588";ctx.lineWidth=lw;ctx.stroke();
  ctx.fillStyle="#7788bb";
  ctx.beginPath();ctx.moveTo(-bw*.38,bh*.04);ctx.lineTo(-bw*.1,-bh*.05);ctx.lineTo(-bw*.06,bh*.18);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(bw*.38,bh*.04);ctx.lineTo(bw*.1,-bh*.05);ctx.lineTo(bw*.06,bh*.18);ctx.closePath();ctx.fill();
  ctx.fillStyle="#f0f0f0";rr2(-bw*.12,-bh*.05,bw*.24,bh*.26,4);ctx.fill();
  ctx.fillStyle="#cc2222";
  ctx.beginPath();ctx.moveTo(-bw*.04,-bh*.02);ctx.lineTo(-bw*.07,bh*.1);ctx.lineTo(0,bh*.22);ctx.lineTo(bw*.07,bh*.1);ctx.lineTo(bw*.04,-bh*.02);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.fillStyle="#6677aa";
  ctx.save();ctx.rotate(-0.3);rr2(-bw*.04,bh*.04,bw*.36,bh*.09,6);ctx.fill();ctx.strokeStyle="#445588";ctx.lineWidth=lw;ctx.stroke();ctx.restore();
  ctx.save();ctx.rotate(0.3);rr2(-bw*.32,bh*.04,bw*.36,bh*.09,6);ctx.fill();ctx.stroke();ctx.restore();
  ctx.fillStyle="#f4a060";ctx.beginPath();ctx.ellipse(0,bh*.13,bw*.13,bh*.065,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d4805a";ctx.lineWidth=1.5;ctx.stroke();
  ctx.save();ctx.rotate(0.12);
  ctx.fillStyle="#f4c090";ctx.beginPath();ctx.ellipse(0,-bh*.23,bw*.33,bh*.22,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d4a070";ctx.lineWidth=lw;ctx.stroke();
  ctx.fillStyle="#2a2210";ctx.beginPath();ctx.ellipse(bw*.06,-bh*.41,bw*.29,bh*.065,0.25,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#2a2210";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-bw*.22,-bh*.38);ctx.quadraticCurveTo(-bw*.32,-bh*.52,bw*.05,-bh*.5);ctx.stroke();
  ctx.fillStyle="#ffcccc";
  ctx.beginPath();ctx.ellipse(-bw*.11,-bh*.25,bw*.085,bh*.06,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bw*.11,-bh*.25,bw*.085,bh*.06,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#4466cc";
  ctx.beginPath();ctx.ellipse(-bw*.11,-bh*.25,bw*.055,bh*.04,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bw*.11,-bh*.25,bw*.055,bh*.04,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#111";
  ctx.beginPath();ctx.ellipse(-bw*.11,-bh*.25,bw*.03,bh*.025,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bw*.11,-bh*.25,bw*.03,bh*.025,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=0.7+Math.sin(globalT*.12)*.3;
  ctx.fillStyle="#aaceff";
  const td=((globalT*.028)%1)*bh*.25;
  ctx.beginPath();ctx.ellipse(-bw*.11,-bh*.16+td,bw*.022,bh*.03+td*.1,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(bw*.11,-bh*.16+td,bw*.022,bh*.03+td*.1,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle="#c4906a";ctx.lineWidth=2.5;
  const tremble=Math.sin(globalT*.45)*2;
  ctx.beginPath();ctx.moveTo(-bw*.1,-bh*.1+tremble*.002);ctx.quadraticCurveTo(0,-bh*.06,bw*.1,-bh*.1+tremble*.002);ctx.stroke();
  ctx.strokeStyle="#443322";ctx.lineWidth=3.5;
  ctx.beginPath();ctx.moveTo(-bw*.18,-bh*.34);ctx.lineTo(-bw*.05,-bh*.3);ctx.stroke();

  ctx.beginPath();ctx.ellipse(-bw*.19,-bh*.2,bw*.1,bh*.04,0,0,Math.PI*2);ctx.fill();

// ═══════════════════════════════════════════════════════
//  DRAW PARTICLES & EFFECTS
// ═══════════════════════════════════════════════════════
function drawParticles(){
  for(const p of particles){
    ctx.save();ctx.globalAlpha=p.life;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    if(p.shape==="star"){drawStar5(0,0,p.size,p.color,"#333");}
    else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(0,0,p.size,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(0,0,0,0.3)";ctx.lineWidth=1;ctx.stroke();}
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawBgSparkles(){
  for(const s of bgSparkles){
    ctx.save();ctx.globalAlpha=s.life*.75;ctx.translate(s.x,s.y);ctx.rotate(s.rot);
    drawStar5(0,0,s.size,s.color,"rgba(0,0,0,0.4)");ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawFloatTexts(){
  for(const t of floatTexts){
    ctx.save();ctx.globalAlpha=t.life;
    const fs=Math.floor(Math.min(22,W*.04)*t.scale);
    ctx.font=`bold ${fs}px "Arial Black",Arial,sans-serif`;
    ctx.textAlign="center";ctx.lineWidth=5;ctx.strokeStyle="rgba(0,0,0,0.8)";
    ctx.strokeText(t.text,t.x,t.y);ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y);
    ctx.restore();
  }
}
function drawZoneFlash(){
  if(zoneFlash.alpha<=0) return;
  ctx.save();ctx.globalAlpha=zoneFlash.alpha;
  ctx.font=`bold ${Math.floor(Math.min(15,W*.03))}px Arial,sans-serif`;
  ctx.textAlign="center";ctx.lineWidth=3;ctx.strokeStyle="#000";
  ctx.strokeText(zoneFlash.label,zoneFlash.x,zoneFlash.y);
  ctx.fillStyle="#ffee00";ctx.fillText(zoneFlash.label,zoneFlash.x,zoneFlash.y);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════════════
function drawUI(){
  const pad=10,uiW=Math.min(W*.82,340),uiX=(W-uiW)/2,uiY=pad,fs=Math.min(13,W*.028);

  // score panel
  ctx.fillStyle="rgba(0,0,0,0.62)";rr2(uiX,uiY,uiW,52,12);ctx.fill();
  ctx.fillStyle="#ffcc44";ctx.font=`bold ${fs}px Arial,sans-serif`;ctx.textAlign="left";
  ctx.fillText(STR.score,uiX+12,uiY+17);
  ctx.fillStyle="#ffffff";ctx.font=`bold ${Math.min(24,W*.046)}px "Arial Black",Arial,sans-serif`;
  ctx.fillText(score.toLocaleString(),uiX+12,uiY+43);
  const slabels=[STR.stageNormal,STR.stageAngry,STR.stageBeg];
  const scols=["#55dd55","#ff5500","#ff88cc"];
  ctx.font=`bold ${Math.min(11,W*.022)}px Arial,sans-serif`;ctx.textAlign="right";
  ctx.fillStyle=scols[bossStage];ctx.fillText(slabels[bossStage],uiX+uiW-10,uiY+26);
  ctx.fillStyle="rgba(255,255,255,0.45)";ctx.font=`${Math.min(10,W*.02)}px Arial,sans-serif`;
  ctx.fillText(`${STR.hitsLabel} ${totalHits}${STR.hitsUnit}`,uiX+uiW-10,uiY+44);

  // anger bar
  const barY=uiY+60;
  ctx.fillStyle="rgba(0,0,0,0.55)";rr2(uiX,barY,uiW,26,8);ctx.fill();
  if(anger>0.01){
    const af=ctx.createLinearGradient(uiX,0,uiX+uiW,0);
    af.addColorStop(0,"#ff2200");af.addColorStop(0.6,"#ff6600");af.addColorStop(1,"#ffcc00");
    ctx.fillStyle=af;const fw=uiW*anger;if(fw>8){rr2(uiX,barY,fw,26,8);ctx.fill();}
  }
  const pulse=anger>.8?0.6+Math.sin(globalT*.2)*.4:1;
  ctx.strokeStyle=`rgba(255,100,0,${pulse})`;ctx.lineWidth=2;rr2(uiX,barY,uiW,26,8);ctx.stroke();
  ctx.fillStyle="#fff";ctx.font=`bold ${Math.min(11,W*.022)}px Arial,sans-serif`;
  ctx.textAlign="center";ctx.fillText(STR.angerLabel,W/2,barY+17);

  // combo
  if(combo>=2){
    const comboY=barY+50;
    const cc=combo>=15?"#ff2200":combo>=8?"#ff8800":"#ffee00";
    const cscale=Math.min(1+combo*.04,2.5);
    ctx.save();ctx.translate(W/2,comboY);ctx.scale(cscale,cscale);
    const cf=Math.min(20,W*.038)/cscale;
    ctx.font=`bold ${cf}px "Arial Black",Arial,sans-serif`;ctx.textAlign="center";
    ctx.lineWidth=4;ctx.strokeStyle="#000";ctx.strokeText(`${combo} ${STR.comboSuffix}`,0,0);
    ctx.fillStyle=cc;ctx.fillText(`${combo} ${STR.comboSuffix}`,0,0);
    ctx.restore();
  }

  // GPT charge hint (bottom-left near robot)
  if(!gpt.skillReady&&phase==="play"){
    const gpx=gptCX(), gpy=H*.86;
    ctx.fillStyle="rgba(0,0,0,0.5)";rr2(gpx-50,gpy-16,100,20,6);ctx.fill();
    ctx.fillStyle="#10a37f";ctx.font=`${Math.min(10,W*.02)}px Arial,sans-serif`;
    ctx.textAlign="center";ctx.fillText("AI 충전 중... 클릭하면 발동!",gpx,gpy);
  }
}

// ═══════════════════════════════════════════════════════
//  START SCREEN
// ═══════════════════════════════════════════════════════
function drawStart(){
  drawBG();
  ctx.fillStyle="rgba(0,0,0,0.55)";ctx.fillRect(0,0,W,H);

  const pw=Math.min(W*.88,440),ph=290,px=(W-pw)/2,py=H*.2;
  ctx.fillStyle="rgba(10,20,30,0.88)";rr2(px,py,pw,ph,22);ctx.fill();
  // border — half green half orange
  const bgrad=ctx.createLinearGradient(px,py,px+pw,py);
  bgrad.addColorStop(0,"#10a37f");bgrad.addColorStop(1,"#ff8800");
  ctx.strokeStyle=bgrad;ctx.lineWidth=3;rr2(px,py,pw,ph,22);ctx.stroke();

  // title
  ctx.textAlign="center";
  ctx.font=`bold ${Math.min(32,W*.065)}px "Arial Black",Arial,sans-serif`;
  ctx.shadowColor="#ff4400";ctx.shadowBlur=20;
  ctx.lineWidth=5;ctx.strokeStyle="#111";ctx.strokeText(STR.title,W/2,py+58);
  ctx.fillStyle="#ffcc00";ctx.fillText(STR.title,W/2,py+58);
  ctx.shadowBlur=0;
  // "with ChatGPT" subtitle
  ctx.font=`bold ${Math.min(18,W*.036)}px Arial,sans-serif`;
  ctx.lineWidth=3;ctx.strokeStyle="#000";ctx.strokeText(STR.titleSub,W/2,py+84);
  ctx.fillStyle="#10a37f";ctx.fillText(STR.titleSub,W/2,py+84);

  ctx.fillStyle="#ffddbb";ctx.font=`${Math.min(13,W*.026)}px Arial,sans-serif`;
  ctx.fillText(STR.subtitle,W/2,py+112);

  // instructions
  const iy=py+138;
  ctx.fillStyle="rgba(255,200,100,0.12)";rr2(px+18,iy-16,pw-36,86,8);ctx.fill();
  ctx.fillStyle="#ffddaa";ctx.font=`${Math.min(11,W*.022)}px Arial,sans-serif`;
  ctx.fillText("👆 상사 머리 = 3배 | 몸통 = 2배 | 발 = 1배",W/2,iy+5);
  ctx.fillText("⚡ 빠른 클릭 = 콤보 보너스 누적!",W/2,iy+25);
  ctx.fillStyle="#10a37f";
  ctx.fillText("🤖 ChatGPT 자동 공격 + 충전 후 클릭으로 AI 빔 발사!",W/2,iy+48);
  ctx.fillStyle="#aaffcc";
  ctx.fillText("충전 완료되면 ChatGPT 로봇을 클릭하세요!",W/2,iy+68);

  const pulse=0.65+Math.sin(globalT*.08)*.35;
  ctx.globalAlpha=pulse;ctx.fillStyle="#ffffff";
  ctx.font=`bold ${Math.min(15,W*.03)}px Arial,sans-serif`;
  ctx.fillText(STR.tapToStart,W/2,py+ph-18);
  ctx.globalAlpha=1;
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function render(){
  ctx.save();
  if(screenShakeTick>0) ctx.translate(Math.round(screenShakeX),Math.round(screenShakeY));
  if(phase==="start"){drawStart();}
  else{
    drawBG();
    drawBgSparkles();
    drawGptBeam();      // beam goes behind boss
    drawGPT();
    drawBoss();
    drawParticles();
    drawZoneFlash();
    drawFloatTexts();
    drawUI();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════
const devEl=document.getElementById("dev");
const showDev=new URLSearchParams(location.search).has("dev");
if(showDev) devEl.style.display="block";

function frame(now){
  requestAnimationFrame(frame);
  if(paused) return;
  acc+=now-last;last=now;
  while(acc>=STEP){update();acc-=STEP;}
  render();
  if(showDev&&(frameCount++,now-fpsAt>=500)){
    fps=Math.round(frameCount*1000/(now-fpsAt));frameCount=0;fpsAt=now;
    devEl.textContent=fps+" fps";
  }
}
requestAnimationFrame(frame);

// ── PWA: Service Worker 등록 ──
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        w && w.addEventListener("statechange", () => {
          if (w.state === "installed" && navigator.serviceWorker.controller) {
            // 새 버전 설치됨 — 조용히 업데이트
            w.postMessage({ type: "SKIP_WAITING" });
          }
        });
      });
    });
  });
}

<script>
let deferredPrompt = null;
const banner = document.getElementById("install-banner");
const installBtn = document.getElementById("install-btn");
const dismissBtn = document.getElementById("install-dismiss");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(() => { banner.style.display = "block"; }, 3000);
});

installBtn && installBtn.addEventListener("click", async () => {
  banner.style.display = "none";
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
  }
});

dismissBtn && dismissBtn.addEventListener("click", () => { banner.style.display = "none"; });

window.addEventListener("appinstalled", () => { banner.style.display = "none"; deferredPrompt = null; });
</script>
