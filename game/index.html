const LEVELS=[{"size":5,"pairs":[[4,0,4,4],[0,0,1,1],[1,0,3,0]]},{"size":5,"pairs":[[3,4,4,4],[0,3,2,4],[0,0,0,2]]},{"size":5,"pairs":[[0,0,2,1],[3,4,4,4],[2,2,2,4]]},{"size":5,"pairs":[[3,1,4,4],[0,0,0,2],[0,3,3,2]]},{"size":5,"pairs":[[2,0,4,4],[0,0,0,2],[0,3,1,0]]},{"size":5,"pairs":[[3,4,4,4],[2,0,2,2],[2,3,2,4],[0,0,1,0]]},{"size":5,"pairs":[[0,2,2,1],[4,1,4,4],[2,2,4,0],[0,0,0,1]]},{"size":5,"pairs":[[2,3,4,1],[0,0,0,1],[4,2,4,4],[0,2,2,2]]},{"size":5,"pairs":[[2,3,3,4],[0,2,2,2],[0,0,0,1],[3,3,4,4]]},{"size":5,"pairs":[[3,1,4,4],[0,0,0,1],[1,2,3,2],[0,2,1,3]]},{"size":6,"pairs":[[3,0,4,3],[1,1,3,1],[0,0,1,2],[4,4,5,0]]},{"size":6,"pairs":[[0,4,1,4],[0,0,0,3],[3,0,5,0],[1,3,3,1]]},{"size":6,"pairs":[[5,3,5,0],[0,0,2,2],[2,3,4,4],[4,5,5,4]]},{"size":6,"pairs":[[3,2,5,0],[0,0,0,3],[2,5,3,3],[0,4,2,4]]},{"size":6,"pairs":[[1,1,3,4],[3,3,5,5],[0,0,1,2],[5,4,5,3],[5,2,5,0]]},{"size":6,"pairs":[[2,3,3,0],[4,0,5,5],[5,4,5,0],[0,0,1,3],[1,2,2,2]]},{"size":6,"pairs":[[4,4,5,0],[2,0,2,1],[2,2,3,3],[3,2,4,3],[0,0,1,0]]},{"size":6,"pairs":[[2,0,3,3],[3,0,4,5],[5,5,5,0],[0,0,1,0],[3,2,3,1]]},{"size":6,"pairs":[[0,0,1,0],[3,0,4,5],[5,5,5,3],[5,2,5,0],[2,0,3,1]]},{"size":6,"pairs":[[0,0,1,3],[5,3,5,0],[3,2,3,0],[1,2,3,3],[4,0,5,4]]},{"size":7,"pairs":[[3,3,5,4],[6,3,6,6],[0,0,0,6],[1,6,3,4],[5,3,6,2]]},{"size":7,"pairs":[[6,2,6,6],[0,0,1,3],[5,0,6,1],[3,0,5,1],[1,2,3,1]]},{"size":7,"pairs":[[3,5,4,5],[2,0,3,6],[4,6,6,0],[0,0,1,0],[6,1,6,6]]},{"size":7,"pairs":[[6,0,6,6],[3,6,4,1],[4,2,5,0],[0,0,0,5],[0,6,2,6]]},{"size":7,"pairs":[[3,3,4,3],[0,0,2,2],[2,3,3,4],[5,5,6,6],[4,4,5,6]]},{"size":7,"pairs":[[6,3,6,6],[4,5,5,0],[1,0,2,5],[6,0,6,2],[2,6,4,4],[0,0,1,1]]},{"size":7,"pairs":[[0,0,0,3],[0,4,1,5],[5,0,6,6],[4,4,5,1],[1,4,2,4],[2,5,4,3]]},{"size":7,"pairs":[[0,0,1,6],[3,6,4,4],[4,5,5,1],[5,0,6,1],[6,2,6,6],[1,5,2,6]]},{"size":7,"pairs":[[6,3,6,6],[4,0,5,3],[2,4,3,0],[0,0,1,0],[5,2,6,2],[2,0,2,3]]},{"size":7,"pairs":[[6,2,6,6],[5,0,6,1],[4,5,5,1],[1,0,3,3],[0,0,1,1],[3,2,4,4]]},{"size":7,"pairs":[[6,1,6,3],[6,4,6,6],[4,3,5,2],[1,4,2,5],[2,6,4,2],[0,0,1,5],[5,1,6,0]]},{"size":7,"pairs":[[2,2,5,3],[0,0,2,1],[1,1,1,2],[0,6,6,6],[4,3,4,4],[1,5,0,5],[5,4,2,5]]},{"size":7,"pairs":[[3,2,3,0],[4,3,5,4],[5,3,6,6],[4,0,4,2],[0,5,1,0],[2,0,3,3],[0,0,0,4]]},{"size":7,"pairs":[[1,0,3,4],[0,0,0,4],[3,3,4,3],[0,5,1,1],[5,6,6,2],[4,4,4,6],[6,3,6,6]]},{"size":7,"pairs":[[5,3,6,3],[6,4,6,6],[0,5,1,1],[1,0,2,6],[3,6,3,0],[0,0,0,4],[4,0,5,4]]}];

// ─── SOLVER ──────────────────────────────────────────────────────────────────
function solvePuzzle(levelIdx) {
  const lvl = LEVELS[levelIdx];
  const sz = lvl.size, N = lvl.pairs.length;
  const grid = Array.from({length:sz}, () => new Int8Array(sz).fill(-1));
  const ends0 = lvl.pairs.map(([r1,c1]) => [r1,c1]);
  const ends1 = lvl.pairs.map(p => [p[2],p[3]]);

  lvl.pairs.forEach((p,ci) => { grid[p[0]][p[1]]=ci; grid[p[2]][p[3]]=ci; });

  // sort by manhattan dist ascending (most constrained first)
  const order = Array.from({length:N},(_,i)=>i).sort((a,b)=>{
    const da=Math.abs(ends0[a][0]-ends1[a][0])+Math.abs(ends0[a][1]-ends1[a][1]);
    const db=Math.abs(ends0[b][0]-ends1[b][0])+Math.abs(ends0[b][1]-ends1[b][1]);
    return da-db;
  });

  const paths = ends0.map(s=>[[s[0],s[1]]]);
  const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
  const inB = (r,c) => r>=0&&r<sz&&c>=0&&c<sz;

  // flood-fill count of reachable empty cells from (sr,sc)
  function connected() {
    let fr=-1,fc=-1,total=0;
    for(let r=0;r<sz;r++) for(let c=0;c<sz;c++) if(grid[r][c]===-1){total++;if(fr<0){fr=r;fc=c;}}
    if(total===0) return true;
    const vis=new Uint8Array(sz*sz); const stk=[[fr,fc]]; vis[fr*sz+fc]=1; let cnt=1;
    while(stk.length){const[r,c]=stk.pop();for(const[dr,dc]of DIRS){const nr=r+dr,nc=c+dc;if(inB(nr,nc)&&grid[nr][nc]===-1&&!vis[nr*sz+nc]){vis[nr*sz+nc]=1;cnt++;stk.push([nr,nc]);}}}
    return cnt===total;
  }

  function canReach(ci) {
    const h=paths[ci][paths[ci].length-1],[er,ec]=ends1[ci];
    if(h[0]===er&&h[1]===ec) return true;
    const vis=new Uint8Array(sz*sz); const stk=[[h[0],h[1]]]; vis[h[0]*sz+h[1]]=1;
    while(stk.length){const[r,c]=stk.pop();for(const[dr,dc]of DIRS){const nr=r+dr,nc=c+dc;if(!inB(nr,nc)||vis[nr*sz+nc])continue;if(nr===er&&nc===ec)return true;if(grid[nr][nc]===-1){vis[nr*sz+nc]=1;stk.push([nr,nc]);}}}
    return false;
  }

  let solved=false, iters=0;
  const MAX=400000;

  function dfs(oi) {
    if(solved||++iters>MAX) return;
    if(oi===N){
      for(let r=0;r<sz;r++) for(let c=0;c<sz;c++) if(grid[r][c]===-1) return;
      solved=true; return;
    }
    const ci=order[oi], path=paths[ci], h=path[path.length-1], [er,ec]=ends1[ci];
    if(h[0]===er&&h[1]===ec){dfs(oi+1);return;}
    for(const[dr,dc]of DIRS){
      if(solved) return;
      const nr=h[0]+dr, nc=h[1]+dc;
      if(!inB(nr,nc)) continue;
      const atEnd=(nr===er&&nc===ec);
      if(!atEnd&&grid[nr][nc]!==-1) continue;
      if(atEnd&&grid[nr][nc]!==ci) continue;
      const prev=grid[nr][nc];
      grid[nr][nc]=ci; path.push([nr,nc]);
      if(connected()&&(atEnd||canReach(ci))) dfs(oi);
      if(!solved){path.pop();grid[nr][nc]=prev;}
    }
  }

  dfs(0);
  return solved ? paths.map(p=>p.map(([r,c])=>[r,c])) : null;
}

// Build flat hint-cell list from solution: [ci, r, c] in reveal order
// Skip the first cell (starting endpoint, already placed)
function buildHintCells(solution) {
  const cells = [];
  // interleave colors: take one step from each color per "round"
  const maxLen = Math.max(...solution.map(p=>p.length));
  for(let i=1; i<maxLen; i++) {
    for(let ci=0; ci<solution.length; ci++) {
      if(i < solution[ci].length) {
        const [r,c] = solution[ci][i];
        cells.push([ci,r,c]);
      }
    }
  }
  return cells;
}

// ─── CANVAS ───────────────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);addEventListener('orientationchange',resize);resize();

// ─── STATE ────────────────────────────────────────────────────────────────────
const state={
  screen:'menu',level:0,grid:null,paths:[],endpoints:[],
  dragging:-1,moves:0,completed:false,particles:[],stars:[],t:0,winAnim:0,
  hint:{ solution:null, cells:[], revealed:0, used:0, status:'idle' },
};

const HINT_MAX=3;

function spawnStars(){state.stars=[];const rng=mkRng(77);for(let i=0;i<150;i++)state.stars.push({x:rng()*3000,y:rng()*3000,r:rng()*1.6+0.2,a:rng(),spd:rng()*0.4+0.08});}
spawnStars();

function burst(x,y,col,n=12){for(let i=0;i<n;i++){const a=(Math.PI*2*i/n)+Math.random()*0.6,spd=70+Math.random()*130;state.particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,max:0.7+Math.random()*0.5,r:3+Math.random()*5,col});}}

function initLevel(idx){
  const lvl=LEVELS[idx],sz=lvl.size;
  state.grid=Array.from({length:sz},()=>Array(sz).fill(-1));
  state.paths=lvl.pairs.map(()=>[]);
  state.endpoints=lvl.pairs.map(([r1,c1,r2,c2])=>[[r1,c1],[r2,c2]]);
  lvl.pairs.forEach(([r1,c1,r2,c2],ci)=>{state.grid[r1][c1]=ci;state.grid[r2][c2]=ci;});
  state.dragging=-1;state.moves=0;state.completed=false;state.particles=[];state.winAnim=0;
  state.hint={solution:null,cells:[],revealed:0,used:0,status:'idle'};
}

function isEP(r,c){return state.endpoints.some(([a,b])=>(a[0]===r&&a[1]===c)||(b[0]===r&&b[1]===c));}
function colorOfEP(r,c){return state.endpoints.findIndex(([a,b])=>(a[0]===r&&a[1]===c)||(b[0]===r&&b[1]===c));}

function checkWin(){
  const sz=LEVELS[state.level].size;
  const allConn=state.endpoints.every(([a,b],ci)=>{
    const p=state.paths[ci];if(p.length<2)return false;
    const h=p[0],t=p[p.length-1];
    return(h[0]===a[0]&&h[1]===a[1]&&t[0]===b[0]&&t[1]===b[1])||(t[0]===a[0]&&t[1]===a[1]&&h[0]===b[0]&&h[1]===b[1]);
  });
  if(!allConn)return false;
  const seen=new Set();state.paths.forEach(p=>p.forEach(([r,c])=>seen.add(r*100+c)));
  return seen.size===sz*sz;
}

// ─── HINT LOGIC ──────────────────────────────────────────────────────────────
function requestHint(){
  const h=state.hint;
  if(state.completed) return;
  if(h.used>=HINT_MAX){return;}
  if(h.status==='solving') return;

  if(h.solution===null){
    h.status='solving';
    // Run solver (synchronous — typically fast)
    setTimeout(()=>{
      const sol=solvePuzzle(state.level);
      if(sol){
        h.solution=sol;
        h.cells=buildHintCells(sol);
        h.status='done';
        revealNextHint();
      }else{
        h.status='failed';
      }
    },0);
    return;
  }
  if(h.status==='done') revealNextHint();
}

function revealNextHint(){
  const h=state.hint;
  if(h.used>=HINT_MAX||!h.cells.length) return;
  // advance revealed to expose at least one new cell that player hasn't placed yet
  const startRevealed=h.revealed;
  let advanced=false;
  while(h.revealed<h.cells.length){
    const[ci,r,c]=h.cells[h.revealed];
    const inPlayerPath=state.paths[ci].some(([pr,pc])=>pr===r&&pc===c);
    h.revealed++;
    if(!inPlayerPath){advanced=true;break;}
  }
  if(advanced) h.used++;
}

// ─── LAYOUT ──────────────────────────────────────────────────────────────────
function layout(){
  const sz=LEVELS[state.level].size;
  const pad=Math.min(W,H)*0.06, topH=H*0.14;
  const avail=Math.min(W-pad*2,H-topH-pad*1.5);
  const cell=Math.floor(avail/sz);
  const gw=cell*sz;
  return{cell,ox:Math.floor((W-gw)/2),oy:Math.floor(topH+(H-topH-pad-gw)/2),sz};
}

function cellAt(px,py){const{cell,ox,oy,sz}=layout();const c=Math.floor((px-ox)/cell),r=Math.floor((py-oy)/cell);if(r<0||r>=sz||c<0||c>=sz)return null;return[r,c];}

// ─── HINT BUTTON LAYOUT ──────────────────────────────────────────────────────
function hintBtnRect(){
  const bh=Math.min(W,H)*0.075, bw=Math.min(W,H)*0.34;
  const x=W/2, y=H-bh*0.62;
  return{x,y,w:bw,h:bh};
}

// ─── DRAWING ──────────────────────────────────────────────────────────────────
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function gem(x,y,r,col,pulse=1){
  const pr=r*pulse;
  for(let i=3;i>=1;i--){const g=ctx.createRadialGradient(x,y,0,x,y,pr*i*1.5);g.addColorStop(0,col.glow+(i===1?'66':i===2?'44':'22'));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,pr*i*1.5,0,Math.PI*2);ctx.fill();}
  const bd=ctx.createRadialGradient(x-pr*0.22,y-pr*0.28,pr*0.04,x,y,pr);bd.addColorStop(0,col.light);bd.addColorStop(0.45,col.fill);bd.addColorStop(1,col.dark);ctx.fillStyle=bd;ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI*2*i/6-Math.PI/2;ctx.lineTo(x+Math.cos(a)*pr,y+Math.sin(a)*pr);}ctx.closePath();ctx.fill();
  const sh=ctx.createRadialGradient(x-pr*0.28,y-pr*0.32,0,x,y,pr*0.55);sh.addColorStop(0,'rgba(255,255,255,0.75)');sh.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sh;ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI*2*i/6-Math.PI/2;ctx.lineTo(x+Math.cos(a)*pr,y+Math.sin(a)*pr);}ctx.closePath();ctx.fill();
}

function drawPath(path,col,cell){
  if(path.length<2)return;
  const{ox,oy}=layout(),w=cell*0.3;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  const pts=path.map(([r,c])=>[ox+c*cell+cell/2,oy+r*cell+cell/2]);
  function st(color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();pts.forEach(([px,py],i)=>i===0?ctx.moveTo(px,py):ctx.lineTo(px,py));ctx.stroke();}
  st(col.glow+'22',w*3.2);st(col.glow+'44',w*2.2);st(col.glow+'88',w*1.5);st(col.fill,w);st(col.light,w*0.3);
  ctx.restore();
}

function drawHintCells(){
  const h=state.hint;
  if(h.status!=='done'||h.revealed===0) return;
  const{cell,ox,oy}=layout();
  const t=state.t;
  // draw revealed hint cells (up to h.revealed index)
  const shown=new Set();
  for(let i=0;i<h.revealed;i++){
    const[ci,r,c]=h.cells[i];
    const key=ci*10000+r*100+c;
    if(shown.has(key)) continue;
    shown.add(key);
    // skip if player already placed this
    if(state.paths[ci].some(([pr,pc])=>pr===r&&pc===c)) continue;
    const px=ox+c*cell+cell/2, py=oy+r*cell+cell/2;
    const col=COLORS[ci%COLORS.length];
    const pulse=(Math.sin(t*4+i*0.8)+1)/2;
    const alpha=0.5+pulse*0.45;
    // soft colored ring
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.strokeStyle=col.glow;
    ctx.lineWidth=2.5;
    ctx.shadowColor=col.glow;
    ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(px,py,cell*0.22,0,Math.PI*2);ctx.stroke();
    // center dot
    ctx.globalAlpha=alpha*0.7;
    ctx.fillStyle=col.fill;
    ctx.beginPath();ctx.arc(px,py,cell*0.1,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // arrow toward solution next step (visual polish)
    if(i+1<h.cells.length){
      const[nci,nr,nc]=h.cells[i+1];
      if(nci===ci){
        const dr=nr-r,dc=nc-c;
        const ax=px+dc*cell*0.28, ay=py+dr*cell*0.28;
        ctx.save();ctx.globalAlpha=alpha*0.5;
        ctx.fillStyle=col.glow;
        ctx.beginPath();
        ctx.translate(ax,ay);ctx.rotate(Math.atan2(dr,dc));
        ctx.moveTo(5,0);ctx.lineTo(-4,4);ctx.lineTo(-4,-4);ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }
  }
}

function gText(txt,x,y,sz,fill,shadow,align='center'){ctx.save();ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=`bold ${sz}px "Segoe UI",system-ui,Arial,sans-serif`;ctx.shadowColor=shadow;ctx.shadowBlur=sz*0.9;ctx.fillStyle=shadow;ctx.fillText(txt,x,y);ctx.shadowBlur=sz*0.3;ctx.fillStyle=fill;ctx.fillText(txt,x,y);ctx.restore();}

function btn(txt,x,y,w,h,bg,glow,alpha=1){const r=h*0.42;ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor=glow;ctx.shadowBlur=16;const g=ctx.createLinearGradient(x,y-h/2,x,y+h/2);g.addColorStop(0,bg+'ee');g.addColorStop(1,bg+'99');ctx.fillStyle=g;rr(ctx,x-w/2,y-h/2,w,h,r);ctx.fill();ctx.strokeStyle=glow+'cc';ctx.lineWidth=1.5;rr(ctx,x-w/2,y-h/2,w,h,r);ctx.stroke();ctx.restore();gText(txt,x,y,h*0.4,'#fff',glow);}

function star5(cx,cy,r,c1,c2){ctx.save();ctx.shadowColor=c2;ctx.shadowBlur=r;const g=ctx.createRadialGradient(cx-r*0.2,cy-r*0.3,0,cx,cy,r);g.addColorStop(0,'#fff');g.addColorStop(0.4,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.beginPath();for(let i=0;i<10;i++){const a=Math.PI*i/5-Math.PI/2,rad=i%2===0?r:r*0.42;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}ctx.closePath();ctx.fill();ctx.restore();}

function drawBg(){
  ctx.fillStyle='#00000e';ctx.fillRect(0,0,W,H);
  const n1=ctx.createRadialGradient(W*0.25,H*0.3,0,W*0.25,H*0.3,W*0.55);n1.addColorStop(0,'rgba(60,0,100,0.2)');n1.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=n1;ctx.fillRect(0,0,W,H);
  const n2=ctx.createRadialGradient(W*0.78,H*0.72,0,W*0.78,H*0.72,W*0.45);n2.addColorStop(0,'rgba(0,30,90,0.18)');n2.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=n2;ctx.fillRect(0,0,W,H);
  const t=state.t;
  for(const s of state.stars){const alpha=(Math.sin(t*s.spd+s.a*12)+1)/2*0.75+0.1;ctx.globalAlpha=alpha;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x%W,s.y%H,s.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
}

function drawHUD(){
  const lvl=state.level+1;
  const barH=H*0.12;
  const bg=ctx.createLinearGradient(0,0,0,barH);bg.addColorStop(0,'rgba(5,0,20,0.97)');bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,barH);
  gText(`${STR.level} ${lvl} / 35`,W/2,H*0.042,Math.min(W,H)*0.044,'#ddccff','#cc66ff');
  const bw=Math.min(W*0.7,320),bh=5,bx=(W-bw)/2,by=H*0.082;
  ctx.save();ctx.fillStyle='rgba(80,50,140,0.35)';rr(ctx,bx,by,bw,bh,bh/2);ctx.fill();
  const prog=(state.level/34)*bw;if(prog>2){const pg=ctx.createLinearGradient(bx,0,bx+prog,0);pg.addColorStop(0,'#8833ff');pg.addColorStop(1,'#cc88ff');ctx.fillStyle=pg;rr(ctx,bx,by,prog,bh,bh/2);ctx.fill();}
  ctx.restore();
  gText(`${STR.moves}: ${state.moves}`,W-W*0.04,H*0.042,Math.min(W,H)*0.033,'#aaddff','#33aaff','right');
}

function restartBtnRect(){
  const bh=Math.min(W,H)*0.065, bw=Math.min(W,H)*0.22;
  return{x:W*0.18,y:H-bh*0.62,w:bw,h:bh};
}

function drawHintButton(){
  if(state.completed) return;
  const h=state.hint;
  const{x,y,w}=hintBtnRect();
  const bh=Math.min(W,H)*0.075;

  let label, bgCol, glowCol, alpha=1;
  if(h.status==='solving'){
    label=STR.hint_solving; bgCol='#111133'; glowCol='#4444aa'; alpha=0.7;
  }else if(h.status==='failed'){
    label=STR.hint_failed; bgCol='#221111'; glowCol='#664444'; alpha=0.5;
  }else if(h.used>=HINT_MAX){
    label=STR.hint_done; bgCol='#1a1a2a'; glowCol='#443355'; alpha=0.45;
  }else{
    const rem=HINT_MAX-h.used;
    label=`💡 ${STR.hint}  ${rem}/${HINT_MAX}`;
    bgCol='#0d1a33'; glowCol='#ffcc22'; alpha=1;
  }
  btn(label,x,y,w,bh,bgCol,glowCol,alpha);

  // Restart button
  const rb=restartBtnRect();
  btn('↺ 다시',rb.x,rb.y,rb.w,rb.h,'#0d0022','#5533ff',0.85);
}

function drawGrid(){
  const{cell,ox,oy,sz}=layout();
  const pp=cell*0.12;
  ctx.save();ctx.fillStyle='rgba(8,4,28,0.88)';ctx.strokeStyle='rgba(90,55,160,0.35)';ctx.lineWidth=1.5;rr(ctx,ox-pp,oy-pp,sz*cell+pp*2,sz*cell+pp*2,cell*0.18);ctx.fill();ctx.stroke();ctx.restore();
  ctx.save();ctx.strokeStyle='rgba(110,75,200,0.18)';ctx.lineWidth=1;for(let i=0;i<=sz;i++){ctx.beginPath();ctx.moveTo(ox+i*cell,oy);ctx.lineTo(ox+i*cell,oy+sz*cell);ctx.stroke();ctx.beginPath();ctx.moveTo(ox,oy+i*cell);ctx.lineTo(ox+sz*cell,oy+i*cell);ctx.stroke();}ctx.restore();
  state.paths.forEach((p,ci)=>{if(p.length>=2)drawPath(p,COLORS[ci%COLORS.length],cell);});
  drawHintCells();
  const t=state.t;
  state.endpoints.forEach(([a,b],ci)=>{const col=COLORS[ci%COLORS.length],p=1+Math.sin(t*2.2+ci*1.4)*0.09;for(const[r,c]of[a,b])gem(ox+c*cell+cell/2,oy+r*cell+cell/2,cell*0.32*p,col,p);});
}

function drawParticles(){for(const p of state.particles){ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.max)*0.9;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.2);g.addColorStop(0,p.col.light);g.addColorStop(0.5,p.col.fill);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.2,0,Math.PI*2);ctx.fill();ctx.restore();}}

function drawWinOverlay(){
  const wa=Math.min(state.winAnim,1);
  ctx.save();ctx.globalAlpha=wa*0.78;ctx.fillStyle='#00000a';ctx.fillRect(0,0,W,H);ctx.restore();
  drawParticles();
  const pulse=1+Math.sin(state.t*3.5)*0.04;
  gText(STR.complete,W/2,H*0.3,Math.min(W,H)*0.068*pulse,'#fff','#ffcc22');
  for(let i=0;i<3;i++){const sx=W/2+(i-1)*Math.min(W,H)*0.14,sy=H*0.44;const sr=Math.min(W,H)*0.055*Math.min(1,Math.max(0,wa-i*0.12)*3.5);if(sr>0)star5(sx,sy,sr,'#ffdd00','#ff8800');}
  const nextLvl=state.level+1, bh=Math.min(W,H)*0.088;
  if(nextLvl<35){btn(`${STR.next} →`,W/2,H*0.63,Math.min(W,H)*0.56,bh,'#003322','#00ff88');}
  else{gText(STR.all_clear,W/2,H*0.58,Math.min(W,H)*0.048,'#ffdd44','#ffaa00');btn(STR.play_again,W/2,H*0.65,Math.min(W,H)*0.5,bh,'#220044','#cc44ff');}
  btn(STR.menu,W/2,H*0.77,Math.min(W,H)*0.36,bh*0.82,'#0d0022','#5533ff');
}

function drawMenu(){
  drawBg();const t=state.t,ts=Math.min(W,H)*0.1;
  gText('CRYSTAL',W/2,H*0.26,ts,'#e0ccff','#aa44ff');gText('FLOW',W/2,H*0.26+ts*1.2,ts*1.15,'#fff','#7722ff');
  gText('35단계 젬 퍼즐',W/2,H*0.53,Math.min(W,H)*0.038,'#99bbff','#3366ff');
  for(let i=0;i<COLORS.length;i++){const a=Math.PI*2*i/COLORS.length+t*0.35,rad=Math.min(W,H)*0.26,gx=W/2+Math.cos(a)*rad,gy=H*0.39+Math.sin(a)*rad*0.32,pulse=1+Math.sin(t*1.8+i*1.1)*0.1;gem(gx,gy,Math.min(W,H)*0.03*pulse,COLORS[i],pulse);}
  btn(STR.tap,W/2,H*0.73,Math.min(W,H)*0.54,Math.min(W,H)*0.088,'#1a0044','#bb44ff');
  gText('터치 또는 클릭으로 시작',W/2,H*0.84,Math.min(W,H)*0.025,'rgba(170,140,220,0.65)','rgba(80,40,140,0.4)');
}

function render(){
  ctx.clearRect(0,0,W,H);
  if(state.screen==='menu'){drawMenu();return;}
  drawBg();drawGrid();
  if(!state.completed) drawHintButton();
  drawHUD();
  if(state.completed) drawWinOverlay();
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
function go(idx){state.level=idx;state.screen='game';initLevel(idx);}

function pDown(x,y){
  if(state.screen==='menu'){go(0);return;}
  if(state.completed){
    const bh=Math.min(W,H)*0.088,nextLvl=state.level+1;
    if(nextLvl<35&&Math.abs(y-H*0.63)<bh){go(nextLvl);}
    else if(nextLvl>=35&&Math.abs(y-H*0.65)<bh){go(0);}
    else if(Math.abs(y-H*0.77)<bh*0.82){state.screen='menu';}
    return;
  }
  // restart button?
  const rb=restartBtnRect();
  if(Math.abs(x-rb.x)<rb.w/2&&Math.abs(y-rb.y)<rb.h/2){initLevel(state.level);return;}
  // hint button?
  const{x:hx,y:hy,w:hw}=hintBtnRect();
  const bh=Math.min(W,H)*0.075;
  if(Math.abs(x-hx)<hw/2&&Math.abs(y-hy)<bh/2){requestHint();return;}

  const cell=cellAt(x,y);if(!cell)return;
  const[r,c]=cell;const ci=colorOfEP(r,c);
  if(ci>=0){
    if(state.paths[ci].length>0){state.paths[ci].forEach(([pr,pc])=>{if(!isEP(pr,pc))state.grid[pr][pc]=-1;});}
    state.paths[ci]=[[r,c]];state.grid[r][c]=ci;state.dragging=ci;
    const{ox,oy,cell:cs}=layout();burst(ox+c*cs+cs/2,oy+r*cs+cs/2,COLORS[ci%COLORS.length],6);
  }else{
    const occ=state.grid[r][c];
    if(occ>=0){const p=state.paths[occ],idx=p.findIndex(([pr,pc])=>pr===r&&pc===c);if(idx>=0){for(let i=idx+1;i<p.length;i++){const[pr,pc]=p[i];if(!isEP(pr,pc))state.grid[pr][pc]=-1;}state.paths[occ]=p.slice(0,idx+1);state.dragging=occ;}}
  }
}

function pMove(x,y){
  if(state.dragging<0)return;
  const cell=cellAt(x,y);if(!cell)return;
  const[r,c]=cell,ci=state.dragging,path=state.paths[ci];
  if(!path.length)return;
  const[lr,lc]=path[path.length-1];
  if(lr===r&&lc===c)return;
  if(Math.abs(r-lr)+Math.abs(c-lc)!==1)return;
  const li=path.findIndex(([pr,pc])=>pr===r&&pc===c);
  if(li>=0){for(let i=li+1;i<path.length;i++){const[pr,pc]=path[i];if(!isEP(pr,pc))state.grid[pr][pc]=-1;}state.paths[ci]=path.slice(0,li+1);return;}
  const occ=state.grid[r][c];
  if(occ>=0&&occ!==ci){if(isEP(r,c)&&occ!==ci)return;const op=state.paths[occ],oi=op.findIndex(([pr,pc])=>pr===r&&pc===c);if(oi>=0){for(let i=oi;i<op.length;i++){const[pr,pc]=op[i];if(!isEP(pr,pc))state.grid[pr][pc]=-1;}state.paths[occ]=op.slice(0,oi);}}
  const ep=state.endpoints[ci];
  const isOE=(ep[0][0]===r&&ep[0][1]===c&&!(path[0][0]===ep[0][0]&&path[0][1]===ep[0][1]))||(ep[1][0]===r&&ep[1][1]===c&&!(path[0][0]===ep[1][0]&&path[0][1]===ep[1][1]));
  path.push([r,c]);state.grid[r][c]=ci;state.moves++;
  if(isOE){state.dragging=-1;if(checkWin()){state.completed=true;const{ox,oy,cell:cs,sz}=layout();for(let i=0;i<8;i++){const col=COLORS[i%COLORS.length];burst(ox+Math.random()*cs*sz,oy+Math.random()*cs*sz,col,18);}}}
}

function pUp(){state.dragging=-1;}

canvas.addEventListener('pointerdown',e=>{e.preventDefault();pDown(e.clientX,e.clientY);},{passive:false});
canvas.addEventListener('pointermove',e=>{e.preventDefault();pMove(e.clientX,e.clientY);},{passive:false});
canvas.addEventListener('pointerup',e=>{e.preventDefault();pUp();},{passive:false});
addEventListener('keydown',e=>{
  if(state.screen==='menu'&&(e.code==='Space'||e.code==='Enter')){go(0);return;}
  if(state.screen==='game'&&state.completed){if(e.code==='Enter'||e.code==='Space'){const n=state.level+1;n<35?go(n):go(0);}if(e.code==='Escape')state.screen='menu';return;}
  if(e.code==='KeyH'){requestHint();}
  if(e.code==='KeyR'){initLevel(state.level);}
  if(e.code==='Escape')state.screen='menu';
});

// ─── LOOP ─────────────────────────────────────────────────────────────────────
const STEP=1000/60;let acc=0,last=performance.now(),paused=false,frames=0,fpsAt=last;
const devEl=document.getElementById('dev');
if(new URLSearchParams(location.search).has('dev'))devEl.style.display='block';
addEventListener('blur',()=>paused=true);addEventListener('focus',()=>{paused=false;last=performance.now();});
function tick(dt){
  state.t+=dt/1000;
  if(state.completed)state.winAnim+=dt/700;
  const dead=[];state.particles.forEach((p,i)=>{p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vy+=130*dt/1000;p.life-=dt/1000;p.r*=0.994;if(p.life<=0)dead.push(i);});
  for(let i=dead.length-1;i>=0;i--)state.particles.splice(dead[i],1);
}
function frame(now){requestAnimationFrame(frame);if(paused){last=now;return;}const dt=Math.min(now-last,50);acc+=dt;last=now;while(acc>=STEP){tick(STEP);acc-=STEP;}render();if(devEl.style.display!=='none'&&(frames++,now-fpsAt>=600)){devEl.textContent=Math.round(frames*1000/(now-fpsAt))+' fps';frames=0;fpsAt=now;}}
requestAnimationFrame(frame);
</script>
