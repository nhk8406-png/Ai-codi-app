<title>MoneyFlow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">

<style>
:root {
  --bg: #08101E;
  --surface: #0F1C32;
  --card: #162641;
  --border: #1C3050;
  --text: #ECF0F8;
  --muted: #6B84A3;
  --accent: #F0A030;
  --income: #2ECC9A;
  --expense: #F87171;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-ui: 'DM Sans', system-ui, -apple-system, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #EEF3FA; --surface: #FFFFFF; --card: #F5F8FE;
    --border: #D8E4F2; --text: #0A1628; --muted: #5A738D;
  }
}
:root[data-theme="light"] {
  --bg: #EEF3FA; --surface: #FFFFFF; --card: #F5F8FE;
  --border: #D8E4F2; --text: #0A1628; --muted: #5A738D;
}
:root[data-theme="dark"] {
  --bg: #08101E; --surface: #0F1C32; --card: #162641;
  --border: #1C3050; --text: #ECF0F8; --muted: #6B84A3;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Header ── */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}
.logo {
  font-family: var(--font-display);
  font-size: 20px;
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--text);
}
.logo-mark {
  width: 26px; height: 26px;
  background: var(--accent);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-ui);
  font-size: 12px; font-weight: 700;
  color: #000;
  flex-shrink: 0;
}
.mnav { display: flex; align-items: center; gap: 8px; }
.nbtn {
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); width: 30px; height: 30px;
  border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; line-height: 1; padding: 0;
  transition: background 0.12s;
}
.nbtn:hover { background: var(--border); }
.mlbl { font-size: 14px; font-weight: 600; min-width: 108px; text-align: center; }
.tbtn {
  background: var(--card); border: 1px solid var(--border);
  color: var(--muted); width: 30px; height: 30px;
  border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; padding: 0;
  transition: background 0.12s;
}
.tbtn:hover { background: var(--border); }

/* ── Stats ── */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 14px 24px 10px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 18px;
}
.slabel {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin-bottom: 5px;
}
.snum {
  font-size: 22px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.snum.inc { color: var(--income); }
.snum.exp { color: var(--expense); }
.snum.pos { color: var(--income); }
.snum.neg { color: var(--expense); }
.snum.acc { color: var(--accent); }
.ssub { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* ── Layout ── */
.layout {
  display: grid;
  grid-template-columns: 1fr 298px;
  gap: 10px;
  padding: 0 24px 10px;
  align-items: start;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px;
}
.ptitle {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin-bottom: 14px;
}
#sankey { display: block; width: 100%; }

/* ── Sidebar ── */
.sidebar { display: flex; flex-direction: column; gap: 10px; }

.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.flabel {
  display: block; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); margin-bottom: 4px;
}
.finput {
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px;
  padding: 7px 10px; font-size: 13px;
  font-family: var(--font-ui); width: 100%; outline: none;
  transition: border-color 0.14s;
}
.finput:focus { border-color: var(--accent); }
.finput option { background: var(--surface); }
.btnp {
  background: var(--accent); color: #000;
  border: none; border-radius: 6px;
  padding: 9px 16px; font-size: 13px; font-weight: 600;
  font-family: var(--font-ui); cursor: pointer; width: 100%;
  margin-top: 2px; transition: opacity 0.13s;
}
.btnp:hover { opacity: 0.88; }

/* Txn list */
.tlist {
  max-height: 310px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 1px;
}
.tlist::-webkit-scrollbar { width: 3px; }
.tlist::-webkit-scrollbar-track { background: transparent; }
.tlist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.trow {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 5px; border-radius: 6px; cursor: pointer;
  transition: background 0.1s;
}
.trow:hover { background: var(--card); }
.tpip { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.tmeta { flex: 1; min-width: 0; }
.tname { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttag { font-size: 11px; color: var(--muted); }
.tval { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.tval.inc { color: var(--income); }
.tval.exp { color: var(--expense); }
.empty { text-align: center; padding: 20px 0; color: var(--muted); font-size: 13px; }
.hint { font-size: 10px; color: var(--muted); text-align: center; margin-top: 7px; opacity: 0.7; }

/* ── Breakdown ── */
.bkdn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 18px;
  margin: 0 24px 24px;
}
.bkgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 28px; }
.bkitem { display: flex; flex-direction: column; gap: 4px; }
.bkhdr { display: flex; justify-content: space-between; align-items: center; }
.bkname { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
.bkpip { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.bkamt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bktrack { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.bkfill { height: 100%; border-radius: 2px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .bkgrid { grid-template-columns: 1fr; }
}
</style>

<header class="hdr">
  <div class="logo">
    <div class="logo-mark">₩</div>
    MoneyFlow
  </div>
  <div class="mnav">
    <button class="nbtn" id="prev">‹</button>
    <div class="mlbl" id="mlbl"></div>
    <button class="nbtn" id="next">›</button>
  </div>
  <button class="tbtn" id="tbtn" title="테마 전환">◐</button>
</header>

<div class="stats">
  <div class="stat">
    <div class="slabel">총 수입</div>
    <div class="snum inc" id="si">₩0</div>
    <div class="ssub" id="sin">0건</div>
  </div>
  <div class="stat">
    <div class="slabel">총 지출</div>
    <div class="snum exp" id="se">₩0</div>
    <div class="ssub" id="sen">0건</div>
  </div>
  <div class="stat">
    <div class="slabel">순 흐름</div>
    <div class="snum" id="sn">₩0</div>
    <div class="ssub">수입 − 지출</div>
  </div>
  <div class="stat">
    <div class="slabel">저축률</div>
    <div class="snum acc" id="sr">0%</div>
    <div class="ssub">수입 대비</div>
  </div>
</div>

<div class="layout">
  <div class="panel">
    <div class="ptitle">돈의 흐름 시각화</div>
    <canvas id="sankey"></canvas>
  </div>

  <div class="sidebar">
    <div class="panel">
      <div class="ptitle">거래 추가</div>
      <div class="frow">
        <div>
          <label class="flabel">유형</label>
          <select class="finput" id="ftype">
            <option value="expense">지출</option>
            <option value="income">수입</option>
          </select>
        </div>
        <div>
          <label class="flabel">금액 (원)</label>
          <input type="number" class="finput" id="famt" placeholder="0" min="0">
        </div>
      </div>
      <div class="frow">
        <div>
          <label class="flabel">카테고리</label>
          <select class="finput" id="fcat"></select>
        </div>
        <div>
          <label class="flabel">날짜</label>
          <input type="date" class="finput" id="fdate">
        </div>
      </div>
      <div style="margin-bottom:8px">
        <label class="flabel">메모</label>
        <input type="text" class="finput" id="fmemo" placeholder="선택사항">
      </div>
      <button class="btnp" id="badd">추가하기</button>
    </div>

    <div class="panel">
      <div class="ptitle">최근 거래</div>
      <div class="tlist" id="tlist"></div>
      <div class="hint">Shift+클릭으로 삭제</div>
    </div>
  </div>
</div>

<div class="bkdn">
  <div class="ptitle">카테고리별 지출 내역</div>
  <div class="bkgrid" id="bkgrid"></div>
</div>

<script>
const INC = [
  { id:'salary',   name:'급여',     color:'#2ECC9A' },
  { id:'side',     name:'부업',     color:'#5B8CFF' },
  { id:'invest',   name:'투자수익', color:'#F0A030' },
  { id:'rental',   name:'임대수입', color:'#A78BFA' },
  { id:'bonus',    name:'보너스',   color:'#FB923C' },
  { id:'other_i',  name:'기타수입', color:'#34D399' },
];
const EXP = [
  { id:'housing',       name:'주거비',    color:'#F87171' },
  { id:'food',          name:'식비',      color:'#FBBF24' },
  { id:'transport',     name:'교통비',    color:'#60A5FA' },
  { id:'health',        name:'의료비',    color:'#34D399' },
  { id:'entertainment', name:'여가/문화', color:'#A78BFA' },
  { id:'education',     name:'교육비',    color:'#FB923C' },
  { id:'savings',       name:'저축/투자', color:'#22D3EE' },
  { id:'clothing',      name:'의류/미용', color:'#F472B6' },
  { id:'other',         name:'기타',      color:'#94A3B8' },
];
const MO = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

const now = new Date();
let Y = now.getFullYear(), M = now.getMonth() + 1;
let txns = [], nid = 1;

function key(y, m) { return `mf_${y}_${String(m).padStart(2,'0')}`; }

function load() {
  try {
    const raw = localStorage.getItem(key(Y, M));
    if (raw) {
      txns = JSON.parse(raw);
      nid = Math.max(0, ...txns.map(t => t.id)) + 1;
      return;
    }
  } catch(e) {}
  txns = sample();
  nid = txns.length + 1;
  save();
}

function save() {
  try { localStorage.setItem(key(Y, M), JSON.stringify(txns)); } catch(e) {}
}

function sample() {
  const d = n => `${Y}-${String(M).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
  return [
    { id:1,  type:'income',  cat:'salary',        amount:3500000, memo:'월급',         date:d(25) },
    { id:2,  type:'income',  cat:'side',          amount:480000,  memo:'프리랜서 작업', date:d(15) },
    { id:3,  type:'income',  cat:'invest',        amount:120000,  memo:'배당금',        date:d(10) },
    { id:4,  type:'expense', cat:'housing',       amount:750000,  memo:'월세',          date:d(1)  },
    { id:5,  type:'expense', cat:'food',          amount:195000,  memo:'식료품',        date:d(8)  },
    { id:6,  type:'expense', cat:'food',          amount:88000,   memo:'외식',          date:d(14) },
    { id:7,  type:'expense', cat:'food',          amount:65000,   memo:'배달음식',      date:d(21) },
    { id:8,  type:'expense', cat:'transport',     amount:132000,  memo:'교통비',        date:d(20) },
    { id:9,  type:'expense', cat:'health',        amount:145000,  memo:'병원/약',       date:d(12) },
    { id:10, type:'expense', cat:'entertainment', amount:175000,  memo:'영화/여가',     date:d(18) },
    { id:11, type:'expense', cat:'education',     amount:320000,  memo:'온라인 강의',   date:d(5)  },
    { id:12, type:'expense', cat:'savings',       amount:1200000, memo:'적금',          date:d(25) },
    { id:13, type:'expense', cat:'clothing',      amount:89000,   memo:'옷 구매',       date:d(16) },
    { id:14, type:'expense', cat:'other',         amount:241000,  memo:'기타',          date:d(28) },
  ];
}

function fmt(n) {
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 100000000) return s + '₩' + (a/100000000).toFixed(1) + '억';
  if (a >= 10000)     return s + '₩' + Math.round(a/10000) + '만';
  return s + '₩' + a.toLocaleString('ko-KR');
}
function short(n) {
  const a = Math.abs(n);
  if (a >= 100000000) return (a/100000000).toFixed(1) + '억';
  if (a >= 10000)     return Math.round(a/10000) + '만';
  return a.toLocaleString('ko-KR');
}
function cat(type, id) {
  return (type === 'income' ? INC : EXP).find(c => c.id === id) || { name: id, color:'#94A3B8' };
}

function updateStats() {
  const inc = txns.filter(t => t.type === 'income');
  const exp = txns.filter(t => t.type === 'expense');
  const ti = inc.reduce((s,t) => s+t.amount, 0);
  const te = exp.reduce((s,t) => s+t.amount, 0);
  const net = ti - te;
  const rate = ti > 0 ? Math.round(net/ti*100) : 0;

  document.getElementById('si').textContent = fmt(ti);
  document.getElementById('sin').textContent = inc.length + '건';
  document.getElementById('se').textContent = fmt(te);
  document.getElementById('sen').textContent = exp.length + '건';
  const ne = document.getElementById('sn');
  ne.textContent = (net >= 0 ? '+' : '') + fmt(net);
  ne.className = 'snum ' + (net >= 0 ? 'pos' : 'neg');
  document.getElementById('sr').textContent = rate + '%';
}

function updateList() {
  const el = document.getElementById('tlist');
  const s = [...txns].sort((a,b) => b.date.localeCompare(a.date));
  if (!s.length) { el.innerHTML = '<div class="empty">거래 내역이 없습니다</div>'; return; }
  el.innerHTML = s.map(t => {
    const c = cat(t.type, t.cat);
    return `<div class="trow" data-id="${t.id}">
      <div class="tpip" style="background:${c.color}"></div>
      <div class="tmeta">
        <div class="tname">${t.memo || c.name}</div>
        <div class="ttag">${c.name} · ${t.date.slice(8)}일</div>
      </div>
      <div class="tval ${t.type === 'income' ? 'inc' : 'exp'}">${t.type==='income'?'+':'-'}${t.amount.toLocaleString('ko-KR')}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.trow').forEach(r => r.addEventListener('click', e => {
    if (!e.shiftKey) return;
    txns = txns.filter(t => t.id !== +r.dataset.id);
    save(); render();
  }));
}

function updateBreakdown() {
  const g = document.getElementById('bkgrid');
  const ex = txns.filter(t => t.type === 'expense');
  const tot = ex.reduce((s,t) => s+t.amount, 0);
  const map = {};
  ex.forEach(t => map[t.cat] = (map[t.cat]||0) + t.amount);
  const items = Object.entries(map)
    .map(([id,amt]) => ({...cat('expense',id), amount:amt, pct: tot?Math.round(amt/tot*100):0}))
    .sort((a,b) => b.amount-a.amount);
  if (!items.length) { g.innerHTML = '<div class="empty" style="grid-column:1/-1">지출 내역이 없습니다</div>'; return; }
  const mx = items[0].amount;
  g.innerHTML = items.map(it => `
    <div class="bkitem">
      <div class="bkhdr">
        <div class="bkname"><div class="bkpip" style="background:${it.color}"></div>${it.name}</div>
        <div class="bkamt">${it.pct}% · ${short(it.amount)}</div>
      </div>
      <div class="bktrack"><div class="bkfill" style="width:${Math.round(it.amount/mx*100)}%;background:${it.color}"></div></div>
    </div>`).join('');
}

// ── Sankey ──
function rgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function rrect(ctx, x, y, w, h, r) {
  if (h <= 0) return;
  r = Math.min(r, w/2, h/2);
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w,y, x+w,y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w,y+h, x+w-r,y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x,y+h, x,y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x,y, x+r,y, r);
  ctx.closePath();
}

function drawSankey() {
  const cv = document.getElementById('sankey');
  const par = cv.parentElement;
  const W = par.clientWidth - 36;
  const H = Math.max(280, Math.min(500, W * 0.54));
  const dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const tc = dark ? '#ECF0F8' : '#0A1628';
  const mc = dark ? '#6B84A3' : '#5A738D';

  const im = {}, em = {};
  txns.forEach(t => {
    if (t.type === 'income') im[t.cat] = (im[t.cat]||0) + t.amount;
    else em[t.cat] = (em[t.cat]||0) + t.amount;
  });
  const iN = INC.filter(c => im[c.id]).map(c => ({...c, amt: im[c.id]}));
  const eN = EXP.filter(c => em[c.id]).map(c => ({...c, amt: em[c.id]}));

  if (!iN.length && !eN.length) {
    ctx.fillStyle = mc; ctx.font = '13px "DM Sans",system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('거래를 추가하면 흐름이 표시됩니다', W/2, H/2); return;
  }
  if (!iN.length || !eN.length) {
    ctx.fillStyle = mc; ctx.font = '13px "DM Sans",system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(!iN.length ? '수입 내역을 추가하세요' : '지출 내역을 추가하세요', W/2, H/2); return;
  }

  const ti = iN.reduce((s,n)=>s+n.amt,0);
  const te = eN.reduce((s,n)=>s+n.amt,0);
  const pT=28, pB=8, LW=92, nW=10, gap=6;
  const iX = LW, eX = W - LW - nW;
  const avH = H - pT - pB;

  const iGap = Math.max(0, iN.length-1)*gap;
  const eGap = Math.max(0, eN.length-1)*gap;
  let y = pT;
  iN.forEach(n => { n.nh = (avH-iGap)*n.amt/ti; n.y = y; y += n.nh+gap; });
  y = pT;
  eN.forEach(n => { n.nh = (avH-eGap)*n.amt/te; n.y = y; y += n.nh+gap; });

  const io={}, eo={};
  iN.forEach(n => io[n.id]=0);
  eN.forEach(n => eo[n.id]=0);

  // Draw flow bands
  for (const inc of iN) {
    for (const exp of eN) {
      const fhi = inc.nh * (exp.amt/te);
      const fhe = exp.nh * (inc.amt/ti);
      const y1t = inc.y + io[inc.id], y1b = y1t + fhi;
      const y2t = exp.y + eo[exp.id], y2b = y2t + fhe;
      const cp1 = iX+nW+(eX-iX-nW)*0.42, cp2 = iX+nW+(eX-iX-nW)*0.58;
      const gr = ctx.createLinearGradient(iX+nW,0,eX,0);
      gr.addColorStop(0, rgba(inc.color, 0.38));
      gr.addColorStop(1, rgba(exp.color, 0.28));
      ctx.beginPath();
      ctx.moveTo(iX+nW, y1t);
      ctx.bezierCurveTo(cp1,y1t, cp2,y2t, eX,y2t);
      ctx.lineTo(eX, y2b);
      ctx.bezierCurveTo(cp2,y2b, cp1,y1b, iX+nW,y1b);
      ctx.closePath();
      ctx.fillStyle = gr; ctx.fill();
      io[inc.id] += fhi; eo[exp.id] += fhe;
    }
  }

  // Draw nodes + labels
  ctx.save();
  iN.forEach(n => {
    ctx.fillStyle = n.color; ctx.beginPath();
    rrect(ctx, iX, n.y, nW, n.nh, Math.min(3,n.nh/2)); ctx.fill();
    if (n.nh >= 13) {
      const mid = n.y + n.nh/2;
      ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.fillStyle = tc; ctx.font = '600 12px "DM Sans",system-ui';
      ctx.fillText(n.name, iX-7, n.nh>=26 ? mid-7 : mid);
      if (n.nh >= 26) {
        ctx.fillStyle = mc; ctx.font = '11px "DM Sans",system-ui';
        ctx.fillText(short(n.amt), iX-7, mid+7);
      }
    }
  });
  eN.forEach(n => {
    ctx.fillStyle = n.color; ctx.beginPath();
    rrect(ctx, eX, n.y, nW, n.nh, Math.min(3,n.nh/2)); ctx.fill();
    if (n.nh >= 13) {
      const mid = n.y + n.nh/2;
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillStyle = tc; ctx.font = '600 12px "DM Sans",system-ui';
      ctx.fillText(n.name, eX+nW+7, n.nh>=26 ? mid-7 : mid);
      if (n.nh >= 26) {
        ctx.fillStyle = mc; ctx.font = '11px "DM Sans",system-ui';
        ctx.fillText(short(n.amt), eX+nW+7, mid+7);
      }
    }
  });
  ctx.fillStyle = mc; ctx.font = '600 10px "DM Sans",system-ui';
  ctx.textAlign='right'; ctx.textBaseline='top'; ctx.fillText('수입', iX-7, 9);
  ctx.textAlign='left'; ctx.fillText('지출', eX+nW+7, 9);
  ctx.restore();
}

// ── Form ──
function buildCats() {
  const t = document.getElementById('ftype').value;
  document.getElementById('fcat').innerHTML = (t==='income'?INC:EXP).map(c =>
    `<option value="${c.id}">${c.name}</option>`).join('');
}
document.getElementById('ftype').addEventListener('change', buildCats);
buildCats();
document.getElementById('fdate').value = now.toISOString().slice(0,10);

document.getElementById('badd').addEventListener('click', () => {
  const type   = document.getElementById('ftype').value;
  const amount = parseInt(document.getElementById('famt').value, 10);
  const c      = document.getElementById('fcat').value;
  const date   = document.getElementById('fdate').value;
  const memo   = document.getElementById('fmemo').value.trim();
  if (!amount || amount <= 0) { document.getElementById('famt').focus(); return; }
  if (!date) return;
  txns.push({ id: nid++, type, amount, cat: c, date, memo });
  save();
  document.getElementById('famt').value = '';
  document.getElementById('fmemo').value = '';
  render();
});

// ── Month nav ──
function setMonth(y, m) {
  Y=y; M=m;
  document.getElementById('mlbl').textContent = `${Y}년 ${MO[M-1]}`;
  load(); render();
}
document.getElementById('prev').addEventListener('click', () => {
  let m=M-1, y=Y; if(m<1){m=12;y--;} setMonth(y,m);
});
document.getElementById('next').addEventListener('click', () => {
  let m=M+1, y=Y; if(m>12){m=1;y++;} setMonth(y,m);
});

// ── Theme ──
function isDark() {
  const dt = document.documentElement.dataset.theme;
  if (dt==='dark') return true; if (dt==='light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
document.getElementById('tbtn').addEventListener('click', () => {
  document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
  drawSankey();
});

// ── Render & init ──
function render() { updateStats(); updateList(); updateBreakdown(); drawSankey(); }

document.getElementById('mlbl').textContent = `${Y}년 ${MO[M-1]}`;
load();
document.fonts.ready.then(render);

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawSankey, 120); });
</script>
